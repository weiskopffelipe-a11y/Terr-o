function toggleTrainingFocus(key) {
  const p = STATE.player;
  if (!Array.isArray(p.trainingFocus)) p.trainingFocus = p.trainingFocus ? [p.trainingFocus] : [];
  const idx = p.trainingFocus.indexOf(key);
  if (idx >= 0) {
    p.trainingFocus.splice(idx, 1);
    addLog(`🎯 ${ATTR_LABELS[key]} não é mais uma habilidade principal.`);
  } else if (p.trainingFocus.length >= 3) {
    addLog('⚠️ Você já escolheu 3 habilidades principais — desmarque uma antes de adicionar outra.');
  } else {
    p.trainingFocus.push(key);
    addLog(`🎯 ${ATTR_LABELS[key]} agora é uma habilidade principal.`);
  }
  openTrainingMenu();
}

  addLog(`📱 Você comprou: ${e.name}!`);
  returnToHub();
}

const INVESTMENT_TYPES = {
  poupanca: { name: 'Poupança', risk: 'Baixo', desc: 'Rendimento pequeno, mas garantido.', meanReturn: 0.003, volatility: 0.001 },

function openBanco() {
  const p = STATE.player;

    title: '🏦 Banco', stamp: 'DINHEIRO',

    choices: [
      { label: '📈 Investimentos', sub: 'Escolha onde aplicar seu dinheiro', onclick: 'openInvestMenu()' },
      { label: '📄 Meus bens e contas', sub: 'Veja tudo que você tem e paga', onclick: "openView('assets')" },
      { label: '❤️ Ajudar a família', sub: 'Moral e reputação com a torcida', onclick: "spendMoney('familia')" },

    ],
  };

}

function openInvestMenu() {
  const p = STATE.player;
  const choices = Object.keys(INVESTMENT_TYPES).map(key => {
    const t = INVESTMENT_TYPES[key];
    return { label: t.name, sub: `Risco ${t.risk} · ${t.desc}`, onclick: `chooseInvestType('${key}')` };
  });
  if (p.investments.length) choices.push({ label: '💼 Ver minha carteira', onclick: "openView('portfolio')" });
  choices.push({ label: 'Voltar', onclick: 'openBanco()' });
  STATE.pendingEvent = { title: '📈 Investimentos', stamp: 'DINHEIRO', body: [`Saldo disponível: ${fmtMoney(p.money)}.`], choices };
  STATE.screen = 'event';
  persist(); render();
}

function chooseInvestType(key) {
  if (key === 'acoes' || key === 'cripto') { openInstrumentPicker(key); return; }
  openAmountPicker(key, INVESTMENT_TYPES[key].name);
}

function openInstrumentPicker(key) {
  const t = INVESTMENT_TYPES[key];
  const pool = key === 'acoes' ? STOCK_COMPANIES : CRYPTO_COINS;
  const choices = pool.map(name => ({ label: name, onclick: `openAmountPicker('${key}','${name}')` }));
  choices.push({ label: 'Voltar', onclick: 'openInvestMenu()' });
  STATE.pendingEvent = { title: t.name, stamp: 'DINHEIRO', body: [t.desc, 'Escolha onde aplicar:'], choices };
  STATE.screen = 'event';
  persist(); render();
}

function openAmountPicker(key, instrumentName) {
  const p = STATE.player;
  const t = INVESTMENT_TYPES[key];
  const labels = ['10% do saldo', '25% do saldo', '50% do saldo', 'Tudo'];
  const raw = [0.10, 0.25, 0.50, 1.0].map(pct => Math.round(p.money * pct / 100) * 100);
  const seen = new Set();
  const choices = [];
  raw.forEach((amount, i) => {
    if (amount >= 100 && !seen.has(amount)) { seen.add(amount); choices.push({ label: labels[i], sub: fmtMoney(amount), onclick: `investAmount('${key}',${amount},'${instrumentName}')` }); }
  });
  choices.push({ label: 'Voltar', onclick: key === 'acoes' || key === 'cripto' ? `openInstrumentPicker('${key}')` : 'openInvestMenu()' });
  STATE.pendingEvent = {
    title: instrumentName, stamp: 'DINHEIRO',
    body: [t.desc, `Risco: ${t.risk} · Saldo disponível: ${fmtMoney(p.money)}.`, choices.length === 1 ? 'Você não tem saldo suficiente pra investir agora.' : ''],
    choices,
  };
  STATE.screen = 'event';
  persist(); render();
}

function investAmount(key, amount, instrumentName) {
  const p = STATE.player;
  const t = INVESTMENT_TYPES[key];
  const displayName = instrumentName || t.name;
  amount = Math.min(amount, p.money);
  if (amount < 100) { addLog('💸 Valor pequeno demais pra investir.'); returnToHub(); return; }
  p.money -= amount;
  p.investments.push({ id: 'inv' + Date.now() + '-' + rand(100, 999), type: key, typeName: displayName, amount, value: amount, startAge: p.age });
  addLog(`📈 Você investiu ${fmtMoney(amount)} em ${displayName}.`);
  returnToHub();
}

function cashOutInvestment(id) {
  const p = STATE.player;
  const idx = p.investments.findIndex(i => i.id === id);
  if (idx < 0) { closeView(); return; }
  const inv = p.investments[idx];
  const val = Math.round(inv.value);
  p.money += val;
  const gain = val - inv.amount;
  addLog(`💼 Você resgatou ${inv.typeName}: ${fmtMoney(val)} (${gain >= 0 ? '+' : ''}${fmtMoney(gain)}).`);
  p.investments.splice(idx, 1);
  persist();
  closeView();
}

function applyInvestmentGrowth(p) {
  p.investments.forEach(inv => {
    const t = INVESTMENT_TYPES[inv.type];
    if (!t) return;
    const change = t.meanReturn + (Math.random() * 2 - 1) * t.volatility;
    inv.value = Math.max(0, inv.value * (1 + change));
  });
}

function partnerAction(kind) {
  const p = STATE.player;
  const partner = p.romance.partner;
  if (!partner) { returnToHub(); return; }
  if (kind === 'jantar') {
    const cost = Math.min(p.money, rand(150, 500));
    p.money -= cost;
    partner.happiness = clamp(partner.happiness + rand(6, 10), 0, 100);
    p.morale = clamp(p.morale + rand(4, 8), 0, 100);
    addLog(`🍽️ Jantar romântico com ${partner.name} (${fmtMoney(cost)}).`);
  } else if (kind === 'dia') {
    partner.happiness = clamp(partner.happiness + rand(4, 7), 0, 100);
    p.morale = clamp(p.morale + rand(3, 7), 0, 100);
    addLog('🌅 Vocês passaram o dia juntos, sem pressa.');
  } else if (kind === 'presente') {
    const cost = Math.min(p.money, rand(300, 1500));
    p.money -= cost;
    partner.happiness = clamp(partner.happiness + rand(8, 14), 0, 100);
    addLog(`🎁 Você deu um presente especial pra ${partner.name} (${fmtMoney(cost)}).`);
  } else if (kind === 'conversar') {
    partner.happiness = clamp(partner.happiness + rand(3, 6), 0, 100);
    p.morale = clamp(p.morale + rand(2, 5), 0, 100);
    addLog('💬 Vocês conversaram sobre seus planos de carreira.');
  } else if (kind === 'terminar') {
    addLog(`💔 Você terminou com ${partner.name}.`);
    p.morale = clamp(p.morale - rand(6, 14), 0, 100);
    p.romance = { status: 'solteiro', partner: null };
    returnToHub();
    return;
  }
  returnToHub();
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-'); }
function fmtMoneyShort(euros) {
  euros = euros || 0;
  if (euros >= 1000000) return '€' + (euros / 1000000).toFixed(1).replace('.', ',') + 'mi';
  if (euros >= 1000) return '€' + Math.round(euros / 1000) + 'mil';
  return '€' + Math.round(euros);
}

function render() {
  const root = document.getElementById('root');
  if (!root) return;
  let html;
  switch (STATE.screen) {
    case 'create': html = renderCreate(); break;
    case 'hub': html = renderHub(); break;
    case 'view': html = renderView(); break;
    case 'offers': html = renderOffers(); break;
    case 'name-child': html = renderNameChild(); break;
    case 'match-moment': html = renderMatchMoment(); break;
    case 'penalty': html = renderPenalty(); break;
    case 'dating': html = renderDatingApp(); break;
    case 'match-result': html = renderMatchResult(); break;
    case 'event': html = renderEvent(); break;
    case 'summary': html = renderSummary(); break;
    case 'legacy': html = renderLegacy(); break;
    case 'menu': default: html = renderMenu(); break;
  }
  root.innerHTML = html;
  root.scrollTop = 0;
}

function renderShell(inner) {
  const p = STATE.player;
  if (!p) return `<div class="screen screen-bare">${inner}</div>`;
  return `<div class="screen"><div class="scoreboard">${renderStatusBar()}</div><div class="screen-body">${inner}</div></div>`;
}

function repProgressPct(points) {
  const lvl = repLevelIndex(points);
  const cur = REP_LEVELS[lvl - 1].min;
  const next = REP_LEVELS[lvl] ? REP_LEVELS[lvl].min : cur + 600;
  return clamp(((points - cur) / (next - cur)) * 100, 4, 100);
}

function renderStatusBar() {
  const p = STATE.player;
  const pos = POSITIONS[p.position];
  const lvl = repLevelIndex(p.reputation);
  const phaseLabel = { bairro: 'VÁRZEA', base: 'BASE', pro: 'PROFISSIONAL', retired: 'LENDA' }[p.phase] || '';

      <div class="sb-id">
        <div class="sb-name">${escapeHtml(p.nickname || p.name)}</div>
        <div class="sb-meta">${pos.short} · ${p.age} anos${p.club ? ' · ' + escapeHtml(p.club.name) : ''}</div>
      </div>
      <div class="sb-avatar-wrap"><div class="sb-avatar">${p.avatar}</div><span class="sb-hair-tag">${hair.icon}</span></div>
    </div>
    ${phaseLabel ? `<div class="sb-stamp stamp-${slug(phaseLabel)}">${phaseLabel}</div>` : ''}
    <div class="sb-meters">
      <div class="meter"><span>Fadiga</span><div class="bar"><div class="bar-fill fill-fadiga" style="width:${p.fatigue}%"></div></div></div>
      <div class="meter"><span>Moral</span><div class="bar"><div class="bar-fill fill-moral" style="width:${p.morale}%"></div></div></div>

const SQUAD_STATUS_LABEL = { titular: 'Titular', reserva: 'Reserva', fora: 'Fora do grupo' };

function renderPhaseHeader() {
  const p = STATE.player;

  const status = p.squadStatus || 'titular';
  return `<div class="phase-head"><h2>${escapeHtml(p.club.name)}</h2><p>Temporada ${p.season} · Rodada ${t} de ${CONFIG.TURNS_PER_SEASON} · ${p.club.country} <span class="squad-badge status-${status}">${SQUAD_STATUS_LABEL[status]}</span></p></div>`;

function renderNewsFeed() {
  const p = STATE.player;
  const items = p.log.slice(0, 8).map(l => `<div class="news-item">${escapeHtml(l)}</div>`).join('');

function renderView() {
  const panel = STATE.viewPanel;
  const panelMap = {
    attrs: viewAttrsPanel, friends: viewFriendsPanel, rival: viewRivalPanel, career: viewCareerPanel,
    portfolio: viewPortfolioPanel, assets: viewAssetsPanel, player: viewPlayerPanel, calendar: viewCalendarPanel,
    performance: viewPerformancePanel, standings: viewStandingsPanel, interest: viewInterestPanel,
    evolution: viewEvolutionPanel, goals: viewGoalsPanel, medical: viewMedicalPanel, contract: viewContractPanel,
    family: viewFamilyPanel,
  };
  const fn = panelMap[panel];
  const inner = fn ? fn() : '<div class="card"><p>Painel não encontrado.</p></div>';
  const backTarget = panel === 'portfolio' ? 'openInvestMenu()' : panel === 'assets' ? 'openBanco()' : 'closeView()';
  return renderShell(`${inner}<button class="btn btn-ghost btn-block" onclick="${backTarget}">Voltar</button>`);
}

function viewPortfolioPanel() {
  const p = STATE.player;
  if (!p.investments.length) return `<div class="card"><div class="card-title">💼 Minha Carteira</div><p class="hint-text">Nenhum investimento ativo.</p></div>`;
  const total = p.investments.reduce((s, i) => s + i.value, 0);
  const rows = p.investments.map(inv => {
    const gain = inv.value - inv.amount;
    const pct = inv.amount > 0 ? (gain / inv.amount) * 100 : 0;
    const cls = gain >= 0 ? 'gain-pos' : 'gain-neg';
    return `<div class="invest-row">
      <div class="invest-info">
        <span class="invest-name">${escapeHtml(inv.typeName)}</span>
        <span class="invest-detail">Aplicado ${fmtMoney(inv.amount)} · <span class="${cls}">${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%</span></span>
      </div>
      <div class="invest-actions">
        <span class="invest-value">${fmtMoney(Math.round(inv.value))}</span>
        <button class="btn btn-chip btn-cashout" onclick="cashOutInvestment('${inv.id}')">Resgatar</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-title">💼 Minha Carteira — Total ${fmtMoney(Math.round(total))}</div>${rows}</div>`;
}

function attrBar(key, val) {
  return `<div class="attr-row"><span class="attr-name">${ATTR_LABELS[key]}</span><div class="bar"><div class="bar-fill fill-${ATTR_GROUP[key]}" style="width:${val}%"></div></div><span class="attr-val">${val}</span></div>`;
}

function viewAttrsPanel() {
  const p = STATE.player;
  const body = ['tec', 'fis', 'men'].map(g => {

  return `<div class="card"><div class="card-title">📊 Atributos — Geral ${overallRating(p)}</div>${body}</div>`;

function viewCalendarPanel() {

/* ---- 🏆 classificação ---- */

function generateStandingsTable(p) {
  const country = p.club.country;
  const pool = (!country || country === 'Brasil')
    ? (BR_CLUBS_BY_TIER[p.club.tier] || [])
    : ((TRANSFER_CLUBS[country] && TRANSFER_CLUBS[country].clubs) || []);
  const tierClubs = pool.filter(n => n !== p.club.name);
  const rivals = pickN(tierClubs, Math.min(9, tierClubs.length));
  const ss = p.seasonStats;
  const myPts = (ss.wins || 0) * 3 + (ss.draws || 0);
  const myPlayed = ss.matches || 0;
  const table = [{ name: p.club.name, played: myPlayed, pts: myPts, isMe: true }];
  rivals.forEach(name => {
    const played = myPlayed;
    const w = clamp(Math.round(played * randf(0.25, 0.6)), 0, played);
    const d = clamp(Math.round((played - w) * randf(0.1, 0.5)), 0, played - w);
    table.push({ name, played, pts: w * 3 + d, isMe: false });
  });
  table.sort((a, b) => b.pts - a.pts);
  return table;
}

function viewStandingsPanel() {
  const p = STATE.player;
  const table = generateStandingsTable(p);
  const rows = table.map((t, i) => `<div class="standing-row ${t.isMe ? 'standing-me' : ''}"><span class="standing-pos">${i + 1}º</span>${crestImg(t.name, 20)}<span class="standing-name">${escapeHtml(t.name)}</span><span class="standing-pts">${t.pts} pts</span></div>`).join('');
  const leagueName = (!p.club.country || p.club.country === 'Brasil') ? `Série ${CLUB_TIERS[p.club.tier].division}` : escapeHtml(p.club.country);
  return `<div class="card"><div class="card-title">🏆 Classificação — ${leagueName}</div>${rows}<p class="hint-text">Tabela estimada a partir do seu desempenho na temporada.</p></div>`;
}

/* ---- 🔄 transferências: interesse ---- */

function viewInterestPanel() {
  const p = STATE.player;
  const lvl = repLevelIndex(p.reputation);
  const n = clamp(1 + Math.floor(lvl / 2), 1, 4);
  if (!STATE.interestCache || STATE.interestCache.week !== p.week) {
    const interested = [];
    for (let i = 0; i < n; i++) {
      const t = clamp(p.club.tier + rand(0, 2), 1, clamp(lvl + 1, 1, 6));
      const isIntl = t >= 5;
      let club, country;
      if (isIntl) { const pool = TRANSFER_COUNTRIES.filter(c => TRANSFER_CLUBS[c].tier === t); country = pick(pool.length ? pool : TRANSFER_COUNTRIES); club = pick(TRANSFER_CLUBS[country].clubs); }
      else { club = genClubName(t); country = 'Brasil'; }
      interested.push({ club, country, level: pick(['Baixo', 'Médio', 'Alto']) });
    }
    STATE.interestCache = { week: p.week, list: interested };

  const rows = STATE.interestCache.list.map(o => `<div class="interest-row">${crestImg(o.club, 28)}<div class="interest-info"><span>${escapeHtml(o.club)}</span><span class="invest-detail">${escapeHtml(o.country)}</span></div><span class="squad-badge status-${o.level === 'Alto' ? 'titular' : o.level === 'Médio' ? 'reserva' : 'fora'}">${o.level}</span></div>`).join('');

let _swipeState = null;
function swipeStart(e) {
  const t = e.touches ? e.touches[0] : e;
  _swipeState = { startX: t.clientX, dx: 0 };
}
function swipeMove(e) {
  if (!_swipeState) return;
  const t = e.touches ? e.touches[0] : e;
  _swipeState.dx = t.clientX - _swipeState.startX;
  const card = document.getElementById('swipe-card');
  if (card) {
    card.style.transform = `translateX(${_swipeState.dx}px) rotate(${_swipeState.dx / 18}deg)`;
    card.style.opacity = String(clamp(1 - Math.abs(_swipeState.dx) / 400, 0.4, 1));
  }
}
function swipeEnd() {
  if (!_swipeState) return;
  const dx = _swipeState.dx;
  _swipeState = null;
  if (dx < -70) { swipeChoice('quero'); return; }
  if (dx > 70) { swipeChoice('nao'); return; }
  const card = document.getElementById('swipe-card');
  if (card) { card.style.transform = ''; card.style.opacity = '1'; }
}

        <div class="stat-box"><b>${L.natGoals}</b><span>Gols Seleção</span></div>
        <div class="stat-box"><b>${L.clubs}</b><span>Clubes</span></div>
        <div class="stat-box"><b>${fmtMoneyShort(L.maxValue)}</b><span>Valor máx.</span></div>
      </div>
      <div class="card">
        <div class="card-title">Legado</div>
        ${trophyList || awardList ? (trophyList + awardList) : '<div class="news-item muted">Uma carreira sem títulos — mas com uma história pra contar.</div>'}
      </div>
      <p class="legacy-postcareer">Depois de pendurar as chuteiras: <strong>${escapeHtml(L.postCareer || '')}</strong></p>
      ${L.romanceStatus === 'casado' && L.partnerName ? `<p class="legacy-postcareer">Ao lado de <strong>${escapeHtml(L.partnerName)}</strong>${L.children.length ? `, com ${L.children.length} filho(s): ${L.children.map(escapeHtml).join(', ')}` : ''}.</p>` : ''}
      <button class="btn btn-gold btn-block" onclick="startOverFromLegacy()">Começar Nova Carreira</button>
    </div>
  `;
}

/* =========================== 15. INICIALIZAÇÃO =========================== */

async function init() {
  const root = document.getElementById('root');
  if (root) root.innerHTML = '<div class="loading"><div class="loading-ball">⚽</div><p>Carregando...</p></div>';
  STATE = freshState();
  STATE.saveAvailable = await hasSave();
  render();
}

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  window.addEventListener('DOMContentLoaded', init);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && STATE && STATE.player) persist();
  });
  window.addEventListener('pagehide', () => {
    if (STATE && STATE.player) persist();
  });
}
</script>
</body>
</html>
