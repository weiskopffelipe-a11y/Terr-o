<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Do Terrão ao Profissional</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

/* =========================================================
   DESIGN TOKENS
   Uma identidade em três tons: terra (bairro) -> grama (base)
   -> ouro (profissional). A cor evolui com a carreira, do
   mesmo jeito que o jogador evolui do campo de terra ao topo.
   ========================================================= */
:root {
  --ink: #0d1310;
  --ink-2: #131f19;
  --ink-3: #1b2b22;
  --ink-4: #223529;

  --terrao: #b9662f;
  --terrao-dim: #7a4a26;
  --terrao-glow: rgba(185, 102, 47, 0.35);

  --grama: #3fa35a;
  --grama-dim: #1f5c34;
  --grama-glow: rgba(63, 163, 90, 0.35);

  --ouro: #e7b23c;
  --ouro-dim: #8a6a24;
  --ouro-glow: rgba(231, 178, 60, 0.4);

  --giz: #f4efe6;
  --giz-dim: #a9a297;
  --giz-faint: #6f6a62;
  --linha: rgba(244, 239, 230, 0.14);
  --linha-strong: rgba(244, 239, 230, 0.26);

  --risco: #d1483f;
  --risco-glow: rgba(209, 72, 63, 0.35);
  --info: #4f8fd1;
  --info-glow: rgba(79, 143, 209, 0.35);

  --font-display: 'Anton', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Space Mono', 'Courier New', monospace;

  --radius: 10px;
  --radius-sm: 7px;
  --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--giz);
  font-family: var(--font-body);
  min-height: 100%;
}

body {
  background:
    radial-gradient(ellipse 800px 500px at 50% -10%, rgba(63, 163, 90, 0.10), transparent),
    radial-gradient(ellipse 600px 400px at 90% 100%, rgba(185, 102, 47, 0.08), transparent),
    var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
}

#app { min-height: 100vh; min-height: 100dvh; }
#root { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; margin: 0; }
p { margin: 0 0 8px; line-height: 1.5; color: var(--giz); }
strong { color: var(--giz); font-weight: 700; }
em { color: var(--giz-dim); font-style: normal; }

button { font-family: var(--font-body); cursor: pointer; }
input { font-family: var(--font-body); }

::selection { background: var(--ouro-glow); color: var(--ink); }

:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* =========================== SCREEN / SHELL =========================== */

.screen { animation: screenIn 0.28s ease both; padding-bottom: 28px; }
.screen-bare { padding: 0; }
.screen-body { padding: 14px 14px 4px; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; height: 100dvh; gap: 14px; }
.loading-ball { font-size: 48px; animation: spin 1.1s linear infinite; }
.loading p { color: var(--giz-dim); font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* =========================== SCOREBOARD (HEADER) =========================== */

.scoreboard {
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, #101a14 0%, #0e1611 100%);
  border-bottom: 1px solid var(--linha);
  padding: 12px 14px 10px;
}

.sb-top { display: flex; align-items: center; gap: 10px; }

.sb-num {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--ink);
  background: var(--ouro);
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px var(--ink-3);
}

.sb-id { flex: 1; min-width: 0; }
.sb-name { font-weight: 700; font-size: 15px; color: var(--giz); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-meta { font-family: var(--font-mono); font-size: 11px; color: var(--giz-dim); letter-spacing: 0.02em; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-avatar { font-size: 26px; flex-shrink: 0; }
.sb-avatar-wrap { position: relative; flex-shrink: 0; }
.sb-hair-tag { position: absolute; top: -4px; right: -6px; font-size: 12px; }

.sb-stamp {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 2px 8px;
  border: 1.5px solid var(--ouro-dim);
  color: var(--ouro);
  border-radius: 4px;
  margin-top: 8px;
  transform: rotate(-2deg);
}

.sb-meters { display: flex; gap: 10px; margin-top: 9px; }
.meter { flex: 1; min-width: 0; }
.meter span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--giz-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bar { height: 6px; background: var(--ink-4); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.fill-fadiga { background: linear-gradient(90deg, var(--terrao-dim), var(--terrao)); }
.fill-moral { background: linear-gradient(90deg, var(--grama-dim), var(--grama)); }
.fill-rep { background: linear-gradient(90deg, var(--ouro-dim), var(--ouro)); }
.fill-tec { background: var(--grama); }
.fill-fis { background: var(--info); }
.fill-men { background: var(--ouro); }

/* stamps por fase / tipo de evento */
.stamp-bairro, .sb-stamp.stamp-bairro { color: var(--terrao); border-color: var(--terrao-dim); }
.stamp-base, .sb-stamp.stamp-base { color: var(--grama); border-color: var(--grama-dim); }
.stamp-profissional, .sb-stamp.stamp-profissional { color: var(--ouro); border-color: var(--ouro-dim); }
.stamp-lenda, .sb-stamp.stamp-lenda { color: var(--ouro); border-color: var(--ouro); }
.stamp-lesao { color: var(--risco); border-color: var(--risco); }
.stamp-selecao { color: var(--info); border-color: var(--info); }
.stamp-transferencia { color: var(--info); border-color: var(--info); }
.stamp-midia { color: var(--giz); border-color: var(--linha-strong); }
.stamp-raizes { color: var(--terrao); border-color: var(--terrao); }
.stamp-amor { color: var(--risco); border-color: var(--risco); }
.stamp-celular, .stamp-dinheiro { color: var(--ouro); border-color: var(--ouro-dim); }

/* =========================== BOTÕES =========================== */

.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.01em;
  color: var(--giz);
  background: var(--ink-3);
  min-height: 46px;
  transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn-block { width: 100%; display: block; }
.btn-lg { font-size: 16px; padding: 15px 18px; }
.btn-sm { font-size: 12px; padding: 9px 12px; min-height: 38px; }

.btn-primary { background: var(--grama); color: #06180d; }
.btn-gold { background: linear-gradient(180deg, #f2c563, var(--ouro)); color: #241a04; }
.btn-outline { background: transparent; border: 1.5px solid var(--linha-strong); color: var(--giz-dim); }
.btn-ghost { background: transparent; color: var(--giz-dim); }
.btn-rest { background: var(--ink-4); color: var(--giz); border: 1px dashed var(--linha-strong); margin-top: 8px; }
.btn-chip { background: var(--ink-4); color: var(--giz); width: 44px; padding: 0; font-size: 20px; min-height: 44px; }

/* =========================== MENU =========================== */

.menu-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; gap: 26px; }
.menu-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.menu-ball { font-size: 56px; }
.menu-screen .title-display { font-size: 40px; line-height: 1.08; color: var(--giz); }
.menu-tag { font-style: italic; color: var(--giz-dim); font-size: 14px; max-width: 320px; line-height: 1.5; }
.menu-screen .btn { max-width: 320px; }

/* =========================== CRIAÇÃO =========================== */

.create-screen { padding: 22px 18px 40px; max-width: 480px; margin: 0 auto; }
.create-progress { display: flex; gap: 6px; margin-bottom: 22px; }
.prog-dot { height: 4px; flex: 1; background: var(--ink-4); border-radius: 2px; }
.prog-dot.active { background: var(--ouro); }

.create-title { font-size: 26px; color: var(--giz); margin-bottom: 6px; }
.create-sub { color: var(--giz-dim); font-size: 13px; margin-bottom: 20px; }

.field-label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--giz-dim); margin: 18px 0 8px; }
.field-label .opt { text-transform: none; letter-spacing: 0; opacity: 0.7; }
.field-label strong { color: var(--ouro); font-family: var(--font-mono); }

.text-input {
  width: 100%; background: var(--ink-2); border: 1.5px solid var(--linha); color: var(--giz);
  border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px;
}
.text-input:focus { border-color: var(--ouro); outline: none; }
.text-input::placeholder { color: var(--giz-faint); }

.range-input { width: 100%; accent-color: var(--ouro); height: 28px; }

.create-nav { display: flex; gap: 10px; margin-top: 26px; }
.create-nav .btn { flex: 1; }

.pos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pos-card {
  background: var(--ink-2); border: 1.5px solid var(--linha); border-radius: var(--radius-sm);
  padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--giz);
}
.pos-card.selected { border-color: var(--grama); background: var(--ink-3); box-shadow: 0 0 0 1px var(--grama) inset; }
.pos-emoji { font-size: 22px; }
.pos-name { font-size: 12px; font-weight: 600; text-align: center; }
.pos-short { font-family: var(--font-mono); font-size: 10px; color: var(--giz-dim); }

.number-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 6px; }
.number-display { font-family: var(--font-display); font-size: 34px; color: var(--ouro); min-width: 60px; text-align: center; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn { background: var(--ink-2); border: 1.5px solid var(--linha); color: var(--giz); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; }
.chip-btn.selected { border-color: var(--ouro); color: var(--ouro); background: var(--ink-3); }

.avatar-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.avatar-btn { background: var(--ink-2); border: 1.5px solid var(--linha); border-radius: 50%; width: 48px; height: 48px; font-size: 22px; display: flex; align-items: center; justify-content: center; padding: 0; }
.avatar-btn.selected { border-color: var(--ouro); box-shadow: 0 0 0 2px var(--ouro-glow); }

.pick-list { display: flex; flex-direction: column; gap: 8px; }
.pick-card { text-align: left; background: var(--ink-2); border: 1.5px solid var(--linha); border-left: 4px solid var(--linha-strong); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--giz); }
.pick-card.selected { border-left-color: var(--grama); background: var(--ink-3); }
.pick-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.pick-desc { font-size: 12px; color: var(--giz-dim); line-height: 1.4; }

/* =========================== CARTÕES ESTILO CANHOTO DE INGRESSO =========================== */

.card {
  position: relative;
  background: var(--ink-2);
  border: 1px solid var(--linha);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  margin: 0 0 14px;
  box-shadow: var(--shadow-card);
}
.card::before {
  content: '';
  position: absolute;
  top: -1px; left: 16px; right: 16px; height: 0;
  border-top: 2px dashed var(--linha-strong);
}

.card-title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--giz-dim); margin-bottom: 12px; }

.stamp {
  display: inline-block;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.14em;
  padding: 3px 10px;
  border: 1.5px solid var(--ouro-dim);
  color: var(--ouro);
  border-radius: 4px;
  transform: rotate(-3deg);
  margin-bottom: 12px;
}

.save-toast {
  background: var(--grama-glow); border: 1px solid var(--grama-dim); color: var(--grama);
  font-family: var(--font-mono); font-size: 12px; text-align: center; padding: 9px 12px;
  border-radius: var(--radius-sm); margin-bottom: 12px; animation: screenIn 0.25s ease both;
}

.milestone-toast {
  background: var(--ouro-glow); border: 1.5px solid var(--ouro); color: var(--ouro);
  font-family: var(--font-body); font-weight: 700; font-size: 13px; text-align: center; padding: 11px 14px;
  border-radius: var(--radius-sm); margin-bottom: 12px; animation: popIn 0.35s ease both;
}

.card-news .news-item { font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--linha); color: var(--giz); line-height: 1.4; }
.card-news .news-item:last-child { border-bottom: none; }
.news-item.muted { color: var(--giz-faint); font-style: italic; }

.phase-head { padding: 4px 2px 14px; }
.phase-head h2 { font-size: 22px; color: var(--giz); }
.phase-head p { font-family: var(--font-mono); font-size: 12px; color: var(--giz-dim); margin-top: 4px; }
.squad-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; margin-left: 2px; }
.squad-badge.status-titular { background: var(--grama-glow); color: var(--grama); }
.squad-badge.status-reserva { background: var(--ouro-glow); color: var(--ouro); }
.squad-badge.status-fora { background: var(--risco-glow); color: var(--risco); }

.train-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
.train-btn {
  background: var(--ink-3); border: 1px solid var(--linha); border-radius: var(--radius-sm);
  padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--giz);
}
.train-btn:active { background: var(--ink-4); }
.train-icon { font-size: 20px; }
.train-label { font-size: 10px; text-align: center; line-height: 1.2; }

.quick-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.quick-row .btn { flex: 1; min-width: 46%; }

.card-injury { text-align: center; }
.card-injury .bar { margin: 12px 0 16px; }

/* =========================== PARTIDA =========================== */

.card-moment { text-align: center; }
.moment-vs { font-family: var(--font-mono); font-size: 12px; color: var(--giz-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.moment-progress { font-family: var(--font-mono); font-size: 10px; color: var(--ouro); letter-spacing: 0.06em; margin-top: 4px; }
.moment-icon { font-size: 40px; margin: 10px 0; }
.moment-text { font-size: 16px; color: var(--giz); line-height: 1.5; margin-bottom: 18px; }
.moment-options { display: flex; flex-direction: column; gap: 8px; }
.moment-btn { text-align: left; background: var(--ink-3); border: 1.5px solid var(--linha); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--giz); }
.moment-btn:active { border-color: var(--ouro); }
.moment-label { font-size: 14px; font-weight: 600; }
.moment-attr { font-family: var(--font-mono); font-size: 10px; color: var(--giz-dim); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }

.card-result { text-align: center; }
.result-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; font-weight: 700; margin-bottom: 6px; }
.result-win .result-tag { color: var(--grama); }
.result-draw .result-tag { color: var(--giz-dim); }
.result-loss .result-tag { color: var(--risco); }
.result-score { font-family: var(--font-display); font-size: 52px; color: var(--giz); line-height: 1; animation: popIn 0.35s ease both; }
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-vs { font-size: 13px; color: var(--giz-dim); margin: 4px 0 14px; }
.moment-recap { font-size: 13px; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 14px; background: var(--ink-3); border: 1px solid var(--linha); }
.moment-recap.success { border-color: var(--grama-dim); color: var(--giz); }
.moment-recap.fail { border-color: var(--linha-strong); color: var(--giz-dim); }
.result-rating { font-size: 14px; margin-bottom: 4px; }
.result-rating strong { color: var(--ouro); font-family: var(--font-mono); font-size: 16px; }
.result-stats { font-size: 12px; color: var(--giz-dim); margin-bottom: 4px; }
.result-rep { font-family: var(--font-mono); font-size: 12px; color: var(--grama); margin-bottom: 16px; }
.card-result .btn { margin-top: 14px; }

/* =========================== EVENTOS / RESUMO =========================== */

.card-event, .card-summary { }
.event-title { font-size: 22px; color: var(--giz); margin-bottom: 10px; line-height: 1.15; }
.event-body p { font-size: 14px; color: var(--giz); margin-bottom: 8px; }
.event-gap { height: 6px; }
.event-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.event-choice {
  text-align: left; background: var(--ink-3); border: 1.5px solid var(--linha); border-radius: var(--radius-sm);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--giz);
}
.event-choice:active { border-color: var(--ouro); }
.choice-label { font-size: 14px; font-weight: 600; }
.choice-sub { font-family: var(--font-mono); font-size: 11px; color: var(--giz-dim); }

.card-summary .btn { margin-top: 16px; }

/* =========================== PAINÉIS (ATRIBUTOS / AMIGOS / CARREIRA) =========================== */

.attr-group { margin-bottom: 14px; }
.attr-group-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--giz-faint); margin-bottom: 8px; }
.attr-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.attr-name { font-size: 12px; width: 90px; flex-shrink: 0; color: var(--giz-dim); }
.attr-row .bar { flex: 1; }
.attr-val { font-family: var(--font-mono); font-size: 12px; color: var(--giz); width: 24px; text-align: right; flex-shrink: 0; }

.friend-list { display: flex; flex-direction: column; gap: 8px; }
.friend-row {
  display: block; width: 100%; text-align: left; background: var(--ink-3); border: 1px solid var(--linha);
  border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--giz);
}
.friend-row:active { border-color: var(--ouro); }
.friend-row .friend-name { display: inline-block; font-weight: 600; }
.friend-name em { font-size: 11px; color: var(--giz-dim); font-style: normal; }
.friend-path { display: block; color: var(--giz-dim); font-size: 12px; margin: 2px 0 6px; }
.friend-bar { height: 5px; }
.hint-text { font-size: 12px; color: var(--giz-faint); font-style: italic; margin-top: 10px; text-align: center; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-box { background: var(--ink-3); border-radius: var(--radius-sm); padding: 12px 6px; text-align: center; }
.stat-box b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--ouro); }
.stat-box span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--giz-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

/* =========================== CARTEIRA DE INVESTIMENTOS =========================== */

.invest-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); }
.invest-row:last-child { border-bottom: none; }
.invest-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.invest-name { font-size: 13px; font-weight: 600; }
.invest-detail { font-family: var(--font-mono); font-size: 11px; color: var(--giz-dim); }
.gain-pos { color: var(--grama); }
.gain-neg { color: var(--risco); }
.invest-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.invest-value { font-family: var(--font-mono); font-size: 13px; color: var(--giz); }

function pickOpponentClub(p) {
  const country = p.club && p.club.country;
  if (!country || country === 'Brasil') return genClubName(p.club ? p.club.tier : 1);
  const info = TRANSFER_CLUBS[country];
  if (!info) return genClubName(p.club.tier);
  const pool = info.clubs.filter(c => c !== p.club.name);
  return pick(pool.length ? pool : info.clubs);
}

function freshState() {

  };

let STATE = freshState();

async function persist() {
  try {
    const res = await window.storage.set('save', JSON.stringify(STATE), false);
    if (!res) console.warn('Falha ao salvar (retorno vazio).');
  } catch (e) {
    console.warn('Falha ao salvar progresso:', e);
  }
}

async function manualSave() {
  await persist();
  STATE.saveFlash = true;
  render();
  setTimeout(() => {
    STATE.saveFlash = false;
    if (STATE.screen === 'hub') render();
  }, 1700);
}

async function hasSave() {
  try {
    const res = await window.storage.get('save', false);
    return !!(res && res.value);
  } catch (e) {
    return false;
  }
}

async function loadSave() {
  try {
    const res = await window.storage.get('save', false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      STATE = parsed;
      return true;
    }
  } catch (e) { console.warn('Falha ao carregar save:', e); }
  return false;
}

async function wipeSave() {
  try { await window.storage.delete('save', false); } catch (e) { /* chave pode não existir */ }
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randf(min, max) { return Math.random() * (max - min) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function chance(p) { return Math.random() < p; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function fmtMoney(n) {
  const neg = n < 0;
  n = Math.round(Math.abs(n));
  const s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-R$ ' : 'R$ ') + s;
}

function capAttrVal(v) { return clamp(Math.round(v), 1, 99); }

function addLog(text) {
  if (!STATE.player) return;
  STATE.player.log.unshift(text);
  if (STATE.player.log.length > CONFIG.LOG_MAX) STATE.player.log.length = CONFIG.LOG_MAX;
}

function personalityFx(key) {
  const p = STATE.player && PERSONALITIES[STATE.player.personality];
  if (!p) return 0;
  return p.effects[key] || 0;
}

function overallRating(p) {
  const pos = POSITIONS[p.position];
  const primaryAvg = pos.primary.reduce((s, k) => s + p.attrs[k], 0) / pos.primary.length;
  const allAvg = ATTR_KEYS.reduce((s, k) => s + p.attrs[k], 0) / ATTR_KEYS.length;
  return Math.round(primaryAvg * 0.65 + allAvg * 0.35);
}

function repLevelIndex(points) {
  let lvl = 1;
  for (let i = 0; i < REP_LEVELS.length; i++) if (points >= REP_LEVELS[i].min) lvl = i + 1;
  return lvl;
}
function repLevelName(points) { return REP_LEVELS[repLevelIndex(points) - 1].name; }

function growAttr(p, key, amount) { p.attrs[key] = capAttrVal(p.attrs[key] + amount); }

function effectiveMatchStrength(p) {
  const base = overallRating(p);
  const fatiguePenalty = (p.fatigue / 100) * 14;
  const moraleBonus = (p.morale - 50) / 50 * 8;
  return clamp(Math.round(base - fatiguePenalty + moraleBonus), 1, 99);
}

function newGameStart() {
  hasSave().then(exists => {
    if (exists) {
      STATE.pendingEvent = {
        title: 'Começar Nova Carreira', stamp: 'CARREIRA',
        body: ['Você já tem um jogo salvo.', 'Começar uma nova carreira vai apagar esse progresso salvo. Tem certeza?'],
        choices: [
          { label: 'Sim, apagar e começar de novo', onclick: 'confirmNewGameStart()' },
          { label: 'Cancelar', onclick: 'backToMenu()' },
        ],
      };
      STATE.screen = 'event';
      render();
    } else {
      confirmNewGameStart();
    }
  });
}

function confirmNewGameStart() {
  wipeSave();
  STATE = freshState();
  STATE.screen = 'create';
  STATE.createStep = 1;
  render();
}

function backToMenu() {
  STATE.pendingEvent = null;
  STATE.screen = 'menu';
  render();
}

function continueSavedGame() {
  loadSave().then(ok => {
    if (!ok) { STATE = freshState(); }
    render();
  });
}

function updateCreate(field, value) {
  STATE.createData[field] = value;
  if (field === 'position') {
    STATE.createData.number = POSITIONS[value].numberSuggest;
  }
  render();
}

function createNextStep() {
  if (STATE.createStep < 4) { STATE.createStep++; render(); }
  else finalizeCreation();
}
function createPrevStep() {
  if (STATE.createStep > 1) { STATE.createStep--; render(); }
  else { STATE.screen = 'menu'; render(); }
}

function finalizeCreation() {
  const d = STATE.createData;
  const pos = POSITIONS[d.position];
  const style = STYLES[d.style];
  const pers = PERSONALITIES[d.personality];
  const startBonus = pers.effects.startAttrBonus || 0;

  const attrs = {};
  ATTR_KEYS.forEach(k => {
    let v = 30 + rand(-4, 4) + startBonus;
    if (pos.primary.includes(k)) v += 14;
    if (style.main === k) v += 8;
    if (style.sub === k) v += 4;
    attrs[k] = capAttrVal(v);
  });

  const player = {
    name: d.name.trim() || 'Jogador', nickname: d.nickname.trim(), age: d.age,
    position: d.position, foot: d.foot, height: d.height, weight: d.weight,
    avatar: d.avatar, hairstyle: 'padrao', number: d.number, style: d.style, personality: d.personality,
    attrs, fatigue: 10, morale: 68, squadStatus: 'titular',
    trainingFocus: [pos.primary[0]],
    reputation: 0, money: 0, followers: rand(20, 80),
    phase: 'bairro', week: 1, season: 1,
    club: null, contract: null, agent: null,
    friends: FRIENDS_INIT.map(f => ({ ...f })),
    rival: null,
    romance: { status: 'solteiro', partner: null }, children: [],
    investments: [], vehicles: [], properties: [], bills: [], jewelry: [], electronics: [],
    nationalTeam: { level: 0, caps: 0, goals: 0 },
    injury: null,
    injuryHistory: [],
    ratingHistory: [],
    stats: { matches: 0, goals: 0, assists: 0, titles: 0, caps: 0, natGoals: 0, clubsCount: 0, maxValue: 0 },
    trophies: [], awardsLog: [],
    history: [],
    flags: {},

    base: { seasonsDone: 0 },
    seasonStats: { matches: 0, goals: 0, assists: 0, ratingSum: 0 },
    log: [],

  STATE.player = player;

const TRAINING_TYPES = {
  finalizacao: { label: 'Finalização', icon: '🎯', attrs: ['finalizacao'] },
  drible:      { label: 'Drible',      icon: '🌀', attrs: ['drible'] },
  passe:       { label: 'Passe',       icon: '🎽', attrs: ['passe'] },
  desarme:     { label: 'Desarme',     icon: '🧱', attrs: ['desarme'] },
  velocidade:  { label: 'Velocidade',  icon: '💨', attrs: ['velocidade'] },
  forca:       { label: 'Força',       icon: '🏋️', attrs: ['forca'] },
  resistencia: { label: 'Resistência', icon: '🔋', attrs: ['resistencia'] },
  bolaparada:  { label: 'Bola Parada', icon: '🥅', attrs: ['finalizacao', 'passe'] },
  tatica:      { label: 'Visão Tática',icon: '🧠', attrs: ['visao', 'concentracao'] },
};

function doTraining(typeKey) {
  const p = STATE.player;
  const t = TRAINING_TYPES[typeKey];
  const mult = clamp(1 + personalityFx('trainingMult') - p.fatigue / 140, 0.4, 1.9);
  const parts = [];
  t.attrs.forEach(a => {
    const current = p.attrs[a];
    const diminish = clamp(1.15 - current / 105, 0.12, 1);
    const gain = Math.max(0, Math.round(rand(1, 2) * mult * diminish));
    if (gain > 0) { growAttr(p, a, gain); parts.push(`${ATTR_LABELS[a]} +${gain}`); }
    else parts.push(`${ATTR_LABELS[a]} (perto do limite)`);
  });
  p.fatigue = clamp(p.fatigue + rand(4, 8), 0, 100);
  p.morale = clamp(p.morale + rand(0, 2), 0, 100);
  addLog(`💪 Treino de ${t.label}: ${parts.join(', ')}.`);
  if (p.fatigue >= 92 && chance(0.05)) triggerInjury('excesso de treino');
}

function doRest() {
  const p = STATE.player;
  p.fatigue = clamp(p.fatigue - rand(22, 32), 0, 100);
  p.morale = clamp(p.morale + rand(4, 9), 0, 100);
  addLog('😴 Você descansou e recuperou o fôlego.');
}

function triggerInjury(source) {
  const p = STATE.player;
  const inj = pick(INJURIES);
  const range = INJURY_SEV[inj.sev];
  const turns = rand(range.min, range.max);
  p.injury = { name: inj.name, sev: inj.sev, turnsLeft: turns, totalTurns: turns, source, triedEarly: false };
  p.fatigue = clamp(p.fatigue - 10, 0, 100);
  p.morale = clamp(p.morale - 12, 0, 100);
  p.injuryHistory.push({ name: inj.name, sev: inj.sev, turns, age: p.age, week: p.week });
  addLog(`🩹 Lesão (${inj.sev}): ${inj.name}. Previsão: ${turns} semana(s) fora.`);
}

function poissony(lambda) {
  const L = Math.exp(-Math.max(0.08, lambda));
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L && k < 8);
  return clamp(k - 1, 0, 7);
}

const PENALTY_TEXT = {
  cobrando: ['O árbitro aponta para a marca da cal — pênalti a seu favor!', 'Depois do lance na área, o juiz não tem dúvida: pênalti!'],
  defendendo: ['O árbitro assinala pênalti contra o seu time. Tudo em suas mãos agora.', 'Pênalti contra! A torcida faz silêncio — é você contra o cobrador.'],
};
const PENALTY_ZONES = ['se', 'sc', 'sd', 'ie', 'id'];
const PENALTY_ZONE_WEIGHTED = ['se', 'se', 'sc', 'sd', 'sd', 'ie', 'ie', 'id', 'id'];

function generateBigMoment(p, importance) {
  const role = POSITIONS[p.position].role;
  if ((role === 'ataque' || role === 'meio') && chance(0.14)) {
    return { role, importance, isPenalty: true, penaltyRole: 'cobrando', text: pick(PENALTY_TEXT.cobrando) };
  }
  if (role === 'goleiro' && chance(0.13)) {
    return { role, importance, isPenalty: true, penaltyRole: 'defendendo', text: pick(PENALTY_TEXT.defendendo) };
  }
  const options = ROLE_OPTIONS[role];
  const texts = SCENARIO_TEXT[role][importance] || SCENARIO_TEXT[role].normal;
  return { role, importance, isPenalty: false, text: pick(texts), options };
}

function rollNumChances(importance) {
  if (importance === 'final') return 1;
  const r = Math.random();
  let n;
  if (r < 0.20) n = 0;
  else if (r < 0.55) n = 1;
  else if (r < 0.80) n = 2;
  else if (r < 0.93) n = 3;
  else if (r < 0.98) n = 4;
  else n = 5;
  if ((importance === 'marquee' || importance === 'debut') && n === 0) n = 1;
  return n;
}

function beginMatch(opts) {
  const p = STATE.player;
  const myStrength = effectiveMatchStrength(p);
  const teamBase = opts.teamStrength != null ? opts.teamStrength : myStrength;
  const oppStrength = opts.opponentStrength;

  let myGoalsTeam, oppGoalsTeam;
  if (opts.importance === 'final') {
    oppGoalsTeam = rand(1, 2);
    myGoalsTeam = oppGoalsTeam - 1;
  } else {
    const diff = (teamBase - oppStrength) / 18;
    myGoalsTeam = poissony(clamp(1.1 + diff, 0.2, 3.4));
    oppGoalsTeam = poissony(clamp(1.1 - diff, 0.2, 3.4));
  }

  const numChances = rollNumChances(opts.importance);
  const chances = [];
  for (let i = 0; i < numChances; i++) chances.push(generateBigMoment(p, opts.importance));

  STATE.pendingMatch = {
    opponentName: opts.opponentName, importance: opts.importance,
    myGoalsTeam, oppGoalsTeam, myStrength, oppStrength,
    playerGoals: 0, playerAssists: 0,
    chances, chanceIndex: 0, momentResults: [], ratingNote: 0, bigMoment: null,
    onResolve: opts.onResolve, context: opts.context || {},
  };

  advanceToNextChance();
}

function advanceToNextChance() {
  const pm = STATE.pendingMatch;
  if (pm.chanceIndex < pm.chances.length) {
    const bm = pm.chances[pm.chanceIndex];
    pm.bigMoment = bm;
    STATE.screen = bm.isPenalty ? 'penalty' : 'match-moment';
  } else {
    finishMatch();
    STATE.screen = 'match-result';
  }
  render();
}

function applyBigMomentOutcome(pm, opt, success) {
  const p = STATE.player;
  if (pm.importance === 'final') {
    if (success) {
      pm.myGoalsTeam = pm.oppGoalsTeam + 1;
      if (opt.kind === 'assist') pm.playerAssists++; else pm.playerGoals++;
      pm.ratingNote += 2.2;
      pm.momentText = '🔥 Você vira o jogo nos minutos finais! Herói da decisão.';
    } else {
      pm.ratingNote -= 0.6;
      pm.momentText = 'A chance passa perto, mas não sai. O apito final confirma a derrota.';
    }
    return;
  }
  if (opt.kind === 'goal') {
    if (success) { pm.playerGoals++; pm.myGoalsTeam++; pm.ratingNote += 1.4; pm.momentText = '⚽ GOL! Você balança a rede.'; }
    else { pm.ratingNote -= 0.3; pm.momentText = 'Você tenta, mas a bola não entra dessa vez.'; }
  } else if (opt.kind === 'assist') {
    if (success) { pm.playerAssists++; pm.myGoalsTeam++; pm.ratingNote += 1.0; pm.momentText = '🎯 Assistência! O companheiro não perdoa.'; }
    else { pm.ratingNote -= 0.2; pm.momentText = 'O passe não encontra o companheiro certo.'; }
  } else if (opt.kind === 'stop') {
    if (success) {
      if (pm.oppGoalsTeam > 0) pm.oppGoalsTeam--;
      pm.ratingNote += 1.2;
      pm.momentText = '🛡️ Intervenção decisiva! Você evita o gol adversário.';
    } else {
      pm.oppGoalsTeam++;
      pm.ratingNote -= 0.4;
      pm.momentText = 'Dessa vez o adversário leva a melhor.';
    }
  } else {
    if (success) { pm.ratingNote += 0.5; pm.momentText = 'Decisão segura — você mantém o equilíbrio do time.'; }
    else { pm.ratingNote -= 0.1; pm.momentText = 'Não foi a melhor escolha, mas sem grandes danos.'; }
  }
}

function chooseBigMoment(optionIndex) {
  const pm = STATE.pendingMatch;
  const p = STATE.player;
  if (pm.bigMoment.revealed) return;
  const opt = pm.bigMoment.options[optionIndex];
  const attrVal = p.attrs[opt.attr];
  let successP = opt.base + (attrVal - 50) / 160;
  successP += personalityFx('bigMomentMult');
  if (pm.myGoalsTeam <= pm.oppGoalsTeam) successP += personalityFx('clutchMult');
  successP = clamp(successP, 0.12, 0.93);

  const success = chance(successP);
  pm.bigMoment.chosenLabel = opt.label;
  pm.bigMoment.success = success;
  applyBigMomentOutcome(pm, opt, success);
  pm.momentResults.push({ text: pm.momentText, success });
  pm.bigMoment.revealed = true;
  render();
}

function continueAfterMoment() {
  const pm = STATE.pendingMatch;
  pm.chanceIndex++;
  advanceToNextChance();
}

function pickKeeperZone() { return pick(PENALTY_ZONE_WEIGHTED); }

function resolvePenalty(myZone) {
  const pm = STATE.pendingMatch;
  const p = STATE.player;
  const bm = pm.bigMoment;
  if (bm.revealed) return;
  const keeperZone = pickKeeperZone();
  const matched = myZone === keeperZone;
  let scored;

  if (bm.penaltyRole === 'cobrando') {
    if (!matched) scored = true;
    else {
      const scoreChance = clamp(0.22 + (p.attrs.finalizacao - 50) / 140, 0.08, 0.55);
      scored = chance(scoreChance);
    }
  } else {
    if (!matched) scored = true;
    else {
      const saveSkill = (p.attrs.concentracao + p.attrs.forca) / 2;
      const saveChance = clamp(0.45 + (saveSkill - 50) / 140, 0.20, 0.80);
      scored = !chance(saveChance);
    }
  }

  bm.myZone = myZone; bm.keeperZone = keeperZone; bm.matched = matched; bm.scored = scored;
  bm.chosenLabel = 'Pênalti';
  let momentText;

  if (bm.penaltyRole === 'cobrando') {
    if (scored) {
      pm.playerGoals++; pm.myGoalsTeam++; pm.ratingNote += 1.5; bm.success = true;
      momentText = matched ? '⚽ GOL, mesmo com o goleiro no canto certo! Categoria pura na cobrança.' : '⚽ GOL! O goleiro foi para o outro lado.';
    } else {
      pm.ratingNote -= 0.5; bm.success = false;
      momentText = '🧤 DEFESA! O goleiro adivinhou o canto e espalmou a cobrança.';
    }
  } else {
    if (!scored) {
      pm.ratingNote += 1.6; bm.success = true;
      if (pm.oppGoalsTeam > 0) pm.oppGoalsTeam--;
      momentText = matched ? '🧤 DEFESA! Você pulou para o canto certo e segurou.' : '🧤 Que reflexo! Você pegou a bola no susto.';
    } else {
      pm.ratingNote -= 0.6; bm.success = false;
      pm.oppGoalsTeam++;
      momentText = matched ? 'Você pulou certo, mas o chute foi forte demais para defender.' : 'Você pulou para o lado errado — gol do adversário.';
    }
  }

  pm.momentText = momentText;
  pm.momentResults.push({ text: momentText, success: bm.success });
  bm.revealed = true;
  render();
}

function continueAfterPenalty() {
  const pm = STATE.pendingMatch;
  pm.chanceIndex++;
  advanceToNextChance();
}

const MILESTONE_MATCH_THRESHOLDS = [10, 25, 50, 100, 150, 200, 250, 300, 350, 400];
const MILESTONE_GOAL_THRESHOLDS = [5, 10, 25, 50, 100, 150, 200, 250];

function checkMilestones(p) {
  if (!p.flags.milestonesSeen) p.flags.milestonesSeen = {};
  const seen = p.flags.milestonesSeen;
  const msgs = [];
  if (MILESTONE_MATCH_THRESHOLDS.includes(p.stats.matches) && !seen['m' + p.stats.matches]) {
    seen['m' + p.stats.matches] = true;
    msgs.push(`🏅 Marco atingido: ${p.stats.matches} jogos na carreira!`);
  }
  if (MILESTONE_GOAL_THRESHOLDS.includes(p.stats.goals) && !seen['g' + p.stats.goals]) {
    seen['g' + p.stats.goals] = true;
    msgs.push(`🏅 Marco atingido: ${p.stats.goals} gols na carreira!`);
  }
  if (p.stats.titles === 1 && !seen.firstTitle) { seen.firstTitle = true; msgs.push('🏅 Seu primeiro título como profissional!'); }
  if (p.stats.caps === 1 && !seen.firstCap) { seen.firstCap = true; msgs.push('🏅 Sua primeira convocação para a Seleção!'); }
  msgs.forEach(m => addLog(m));
  if (msgs.length) STATE.milestoneFlash = msgs[msgs.length - 1];
}

function finishMatch() {
  const p = STATE.player;
  const pm = STATE.pendingMatch;
  const diff = pm.myGoalsTeam - pm.oppGoalsTeam;
  let rating = 6.0 + (pm.myStrength - pm.oppStrength) / 40 + diff * 0.15 + (pm.ratingNote || 0);
  rating += pm.playerGoals * 0.5 + pm.playerAssists * 0.3;
  pm.rating = Math.round(clamp(rating, 2, 10) * 10) / 10;
  pm.result = diff > 0 ? 'vitoria' : diff === 0 ? 'empate' : 'derrota';

  p.stats.matches++;
  p.stats.goals += pm.playerGoals;
  p.stats.assists += pm.playerAssists;
  if (p.phase === 'pro') {
    p.seasonStats.matches++;
    p.seasonStats.goals += pm.playerGoals;
    p.seasonStats.assists += pm.playerAssists;
    p.seasonStats.ratingSum += pm.rating;
    if (pm.result === 'vitoria') p.seasonStats.wins = (p.seasonStats.wins || 0) + 1;
    else if (pm.result === 'empate') p.seasonStats.draws = (p.seasonStats.draws || 0) + 1;
    else p.seasonStats.losses = (p.seasonStats.losses || 0) + 1;
  }
  p.ratingHistory.push({ week: p.week, season: p.season, opponent: pm.opponentName, result: pm.result, myGoals: pm.myGoalsTeam, oppGoals: pm.oppGoalsTeam, rating: pm.rating, playerGoals: pm.playerGoals, playerAssists: pm.playerAssists });
  if (p.ratingHistory.length > 200) p.ratingHistory.shift();
  checkMilestones(p);

  p.fatigue = clamp(p.fatigue + rand(3, 6), 0, 100);
  const resultDelta = pm.result === 'vitoria' ? rand(3, 7) : pm.result === 'empate' ? rand(-1, 2) : rand(-6, -2);
  const perfDelta = pm.rating >= 8 ? rand(3, 6) : pm.rating >= 6.5 ? rand(0, 2) : pm.rating >= 5 ? 0 : rand(-6, -3);
  const moraleDelta = resultDelta + perfDelta;
  p.morale = clamp(p.morale + moraleDelta, 0, 100);

  let repGain = Math.round((pm.rating - 5) * 2.1);
  if (pm.importance === 'final') repGain += 12;
  if (pm.importance === 'marquee') repGain += 4;
  if (pm.importance === 'debut') repGain += 6;
  if (pm.context && pm.context.squadStatus === 'reserva') repGain = Math.round(repGain * 0.55);
  if (pm.onResolve === 'national' && pm.importance !== 'debut') repGain = Math.round(repGain * 0.4);
  pm.repGain = Math.max(0, repGain);
  p.reputation += pm.repGain;

  if (pm.rating >= 7 && chance(0.26 + personalityFx('matchLearnMult'))) {
    const k = pick(POSITIONS[p.position].primary);
    if (p.attrs[k] < 96 || chance(0.15)) { growAttr(p, k, 1); pm.learnedAttr = k; }
  }

  let injChance = 0.018 + (p.fatigue > 75 ? (p.fatigue - 75) / 400 : 0);
  if (['ZC', 'VOL', 'CA', 'LD', 'LE'].includes(p.position)) injChance += 0.004;
  if (p.position === 'GO') injChance -= 0.008;
  if (pm.importance === 'final' || pm.importance === 'marquee') injChance += 0.006;
  if (!p.injury && chance(clamp(injChance, 0.005, 0.18))) {
    triggerInjury('partida');
    pm.gotInjured = true;
  }

  addLog(`⚽ ${pm.result === 'vitoria' ? 'Vitória' : pm.result === 'empate' ? 'Empate' : 'Derrota'} vs ${pm.opponentName}: ${pm.myGoalsTeam}x${pm.oppGoalsTeam}. Nota ${pm.rating}.`);
  persist();
}

function continueAfterMatch() {
  const pm = STATE.pendingMatch;
  if (!pm) { STATE.screen = 'hub'; render(); return; }
  if (pm.onResolve === 'bairro') return continueBairro();
  if (pm.onResolve === 'base') return continueBase();
  if (pm.onResolve === 'pro') return continuePro();
  if (pm.onResolve === 'national') return continueNational();
  STATE.screen = 'hub'; STATE.pendingMatch = null; render();
}

/* =========================== 7. FASE: BAIRRO =========================== */

function bairroPlayWeek(resting) {
  const p = STATE.player;
  STATE.milestoneFlash = null;
  if (p.injury) return; // segurança
  if (resting) {
    p.fatigue = clamp(p.fatigue - rand(30, 42), 0, 100);
    p.morale = clamp(p.morale + rand(2, 5), 0, 100);
    addLog('😴 Semana de descanso — fadiga aliviada.');
  } else {
    applyAutomaticTraining(p);
  }

  const oppStrength = clamp(overallRating(p) + rand(-10, 8), 15, 70);
  p.bairro.matchesPlayed++;
  const isFinal = p.bairro.matchesPlayed >= CONFIG.BAIRRO_MATCHES;
  beginMatch({
    opponentName: genClubName(1),
    opponentStrength: oppStrength,
    teamStrength: overallRating(p) + rand(-4, 6),
    importance: isFinal ? 'final' : 'normal',
    onResolve: 'bairro',
  });
}

function continueBairro() {
  const p = STATE.player;
  const pm = STATE.pendingMatch;
  if (pm.result === 'vitoria') p.bairro.wins++;
  if (chance(0.22 + pm.rating / 40)) {
    p.bairro.scoutMeter++;
    addLog(`👀 Um olheiro do ${genClubName(2)} assistiu à partida.`);
  }
  STATE.pendingMatch = null;

  if (p.bairro.matchesPlayed >= CONFIG.BAIRRO_MATCHES) {
    STATE.pendingEvent = buildScoutedEvent();
    STATE.screen = 'event';
  } else if (!maybeQueuePostMatchEvent(pm)) {
    STATE.screen = 'hub';
  }
  persist();
  render();
}

function buildScoutedEvent() {
  const p = STATE.player;
  const good = p.bairro.wins >= 3 || p.reputation >= 30;
  p.flags.peneiraClubBig = good;
  return {
    title: 'Fim do Campeonato de Várzea', stamp: 'VÁRZEA',
    body: [
      `O time terminou a campanha com ${p.bairro.wins} vitória(s) em ${CONFIG.BAIRRO_MATCHES} jogos.`,
      good ? 'A sua atuação chamou atenção: um olheiro te convida para uma peneira num clube de peso.'
           : 'Mesmo assim, alguém te viu jogar: você recebe o convite para uma peneira.',
    ],
    choices: [{ label: 'Ir para a peneira', onclick: 'startPeneira()' }],
  };
}

/* =========================== 8. FASE: PENEIRA =========================== */

function startPeneira() {
  const p = STATE.player;
  STATE.pendingEvent = {
    title: p.flags.peneiraClubBig ? 'Peneira — Clube Grande' : 'Peneira', stamp: 'PENEIRA',
    body: [
      `Você chega ao centro de treinamento do ${genClubName(p.flags.peneiraClubBig ? 3 : 1)}. Dezenas de garotos disputam poucas vagas.`,
      'O treinador observa técnica, físico e atitude.',
    ],
    choices: [{ label: 'Começar avaliação', onclick: 'peneiraChecks()' }],
  };
  STATE.screen = 'event';
  persist(); render();
}

function peneiraChecks() {
  const p = STATE.player;
  const primary = POSITIONS[p.position].primary;
  let successes = 0;
  const details = [];
  primary.forEach(k => {
    const prob = clamp(p.attrs[k] / 99 * 0.9, 0.15, 0.92);
    const ok = chance(prob);
    if (ok) successes++;
    details.push(`${ok ? '✅' : '⏳'} ${ATTR_LABELS[k]}`);
  });
  resolvePeneira(successes, details);
}

function resolvePeneira(successes, details) {
  const p = STATE.player;
  let title, extra;
  if (successes >= 2) {
    title = 'Aprovado!';
    extra = p.flags.peneiraClubBig ? 'Você é aprovado direto para a base de um clube grande.' : 'Você é aprovado para a base do clube.';
  } else if (successes === 1) {
    title = 'Em avaliação';
    extra = '"Você tem talento, mas precisa evoluir." O treinador te dá uma chance na base mesmo assim.';
  } else {
    title = 'Não foi dessa vez...';
    extra = 'Esse clube não te quer agora — mas um olheiro de um clube menor te chama pra tentar lá.';
  }
  STATE.pendingEvent = {
    title, stamp: 'PENEIRA',
    body: [...details, '', extra],
    choices: [{ label: 'Continuar', onclick: `enterBase(${successes})` }],
  };
  STATE.screen = 'event';
  render();
}

function enterBase(successes) {
  const p = STATE.player;
  const tier = p.flags.peneiraClubBig ? (successes >= 2 ? 3 : 2) : (successes >= 2 ? 2 : 1);
  p.club = { name: genClubName(tier), tier, country: 'Brasil' };
  p.history.push({ name: p.club.name, tier, phase: 'base' });
  p.stats.clubsCount++;
  p.phase = 'base';
  p.base.seasonsDone = 0;
  p.week = 1;
  p.rival = { name: randomName('m'), form: overallRating(p) + rand(-6, 10), starter: true, matchesAsStarter: 0 };
  addLog(`🏟️ Você entra na base do ${p.club.name}.`);
  addLog(`Seu concorrente pela posição: ${p.rival.name}.`);
  STATE.pendingEvent = null;
  STATE.screen = 'hub';
  persist();
  render();
}

/* =========================== 9. FASE: BASE =========================== */

function isPlayerStarting() {
  const p = STATE.player;
  return overallRating(p) + p.reputation / 50 >= p.rival.form;
}

function updateRivalForm() {
  const p = STATE.player;
  p.rival.form = clamp(p.rival.form + rand(-3, 3), 20, 95);
}

function baseWeekAction(resting) {
  const p = STATE.player;
  STATE.milestoneFlash = null;
  if (p.injury) return;
  if (resting) {
    p.fatigue = clamp(p.fatigue - rand(30, 42), 0, 100);
    p.morale = clamp(p.morale + rand(2, 5), 0, 100);
    addLog('😴 Semana de descanso — fadiga aliviada.');
  } else {
    applyAutomaticTraining(p);
  }
  p.week++;
  updateRivalForm();
  applyWeeklyPassives();

  const seasonTurn = ((p.week - 1) % CONFIG.TURNS_PER_SEASON) + 1;
  const isSeasonFinal = seasonTurn === CONFIG.TURNS_PER_SEASON;

  if (p.morale < 20) {
    p.squadStatus = 'fora';
    addLog('📋 Moral lá embaixo: o técnico nem te relacionou pra esse jogo.');
    advanceFriendsRandom();
    if (p.flags.babyReady) { triggerChildBirth(); persist(); render(); return; }
    if (isSeasonFinal) { p.base.seasonsDone++; p.age++; if (!checkAndQueueBirthday18(p, 'finishBaseSeasonSummary')) finishBaseSeasonSummary(); }
    else { STATE.screen = 'hub'; }
    persist(); render();
    return;
  }

  const starting = isPlayerStarting();
  p.squadStatus = starting ? 'titular' : 'reserva';
  const oppStrength = clamp(35 + p.club.tier * 8 + rand(-8, 8), 20, 90);

  beginMatch({
    opponentName: genClubName(p.club.tier), opponentStrength: oppStrength,
    teamStrength: overallRating(p) + p.club.tier * 3 + rand(-4, 4),
    importance: isSeasonFinal ? 'final' : 'normal',
    onResolve: 'base', context: { starting, squadStatus: p.squadStatus },
  });
}

function continueBase() {
  const p = STATE.player;
  const pm = STATE.pendingMatch;
  const wasStarting = pm.context.starting;
  if (pm.rating >= 7.5 && !wasStarting) {
    p.rival.form = clamp(p.rival.form - rand(4, 8), 15, 95);
    addLog('📈 Atuação de gala saindo do banco — você ganha espaço na equipe.');
  } else if (pm.rating < 5.5 && wasStarting) {
    p.rival.form = clamp(p.rival.form + rand(2, 5), 15, 95);
  }

  const seasonTurn = ((p.week - 1) % CONFIG.TURNS_PER_SEASON) + 1;
  const isSeasonEnd = seasonTurn === CONFIG.TURNS_PER_SEASON;
  STATE.pendingMatch = null;

  if (isSeasonEnd) {
    p.base.seasonsDone++;
    p.age++;
    if (!checkAndQueueBirthday18(p, 'finishBaseSeasonSummary')) finishBaseSeasonSummary();
  } else if (!maybeQueuePostMatchEvent(pm)) {
    STATE.screen = 'hub';
  }
  persist();
  render();
}

function checkAndQueueBirthday18(p, continuationFnName) {
  if (p.age === 18 && !p.flags.turned18Announced) {
    p.flags.turned18Announced = true;
    STATE.pendingBirthdayContinuation = continuationFnName;
    STATE.pendingEvent = {
      title: '🎉 Você completou 18 anos!', stamp: 'CARREIRA',
      body: ['Você alcançou a maioridade.', 'Isso desbloqueia:', '💘 O app "Encontre seu Amor" no Celular — agora dá pra namorar, noivar, casar e ter filhos.'],
      choices: [{ label: 'Continuar', onclick: 'continueBirthday18()' }],
    };
    STATE.screen = 'event';
    persist(); render();
    return true;
  }
  return false;
}

function continueBirthday18() {
  const fnName = STATE.pendingBirthdayContinuation;
  STATE.pendingBirthdayContinuation = null;
  STATE.pendingEvent = null;
  if (fnName === 'finishBaseSeasonSummary') finishBaseSeasonSummary();
  else if (fnName === 'finishProSeason') finishProSeason();
  else { STATE.screen = 'hub'; persist(); render(); }
}

function finishBaseSeasonSummary() {
  const p = STATE.player;
  const wonTitle = chance(0.16 + p.club.tier * 0.04);
  const lines = [`Temporada ${p.base.seasonsDone} de base concluída. Você tem ${p.age} anos.`];
  if (wonTitle) {
    const titleName = 'Copa Estadual de Base';
    p.trophies.push({ name: titleName, season: p.season, age: p.age, club: p.club.name });
    p.stats.titles++;
    checkMilestones(p);
    lines.push(`🏆 Seu time conquistou a ${titleName}!`);
  }
  const proceed = p.base.seasonsDone >= CONFIG.BASE_SEASONS || (p.base.seasonsDone >= 1 && p.reputation >= 150);
  lines.push(proceed ? 'Times profissionais já observam você de perto...' : 'Mais uma temporada de base pela frente.');

  STATE.pendingSummary = { title: 'Fim de Temporada — Base', stamp: 'BASE', lines, kind: 'base-end', proceed };
  STATE.screen = 'summary';
}

/* =========================== 10. CONTRATO PROFISSIONAL =========================== */

const CLUB_AMBITION_BY_TIER = { 1: 'Acesso', 2: 'Acesso', 3: 'Consolidação', 4: 'Título Nacional', 5: 'Título Continental', 6: 'Título Mundial' };
const OFFER_QUOTES = [
  'A diretoria acredita que você pode ser peça-chave para o projeto.',
  'O departamento de captação aposta em você como reforço estratégico.',
  'A comissão técnica considera seu perfil ideal para o sistema de jogo.',
  'O clube quer valorizar atletas jovens e enxerga potencial em você.',
  'A torcida já está de olho no seu nome desde as categorias de base.',
  'O técnico pediu você especificamente para reforçar o elenco.',
];
const OFFER_OBJECTIVES_POOL = [
  'Conquistar o acesso', 'Consolidar a equipe na divisão', 'Valorizar atletas jovens',
  'Construir uma identidade de jogo reconhecível', 'Brigar por vaga em competição continental',
  'Reconstruir a confiança do elenco', 'Brigar pelo título da divisão', 'Terminar entre os primeiros colocados',
];

function computeCompatibility(p, tier) {
  const rating = overallRating(p);
  const expected = 28 + tier * 9;
  const diff = rating - expected;
  return clamp(Math.round(65 + diff * 1.3 + rand(-7, 7)), 38, 97);
}

function buildOfferCard(tier, agent, roleHint) {
  const t = CLUB_TIERS[clamp(tier, 1, 6)];
  const p = STATE.player;
  const role = roleHint || pick(['titular', 'rotação', 'reserva']);
  const roleMult = role === 'titular' ? 0.85 : role === 'rotação' ? 1.0 : 1.15;
  const salary = Math.round(t.salaryBase * roleMult * agent.dealMult * randf(0.85, 1.2) / 100) * 100;
  const years = pick([2, 2, 3, 3, 4]);
  const isIntl = t.tier >= 5;
  let club, country;
  if (isIntl) {
    const pool = TRANSFER_COUNTRIES.filter(c => TRANSFER_CLUBS[c].tier === t.tier);
    country = pick(pool.length ? pool : TRANSFER_COUNTRIES);
    club = pick(TRANSFER_CLUBS[country].clubs);
  } else {
    club = genClubName(t.tier);
    country = 'Brasil';
  }
  return {
    club, tier: t.tier, division: t.division, country,
    compat: computeCompatibility(p, t.tier),
    quote: pick(OFFER_QUOTES),
    years, salary, signingBonus: Math.round(salary * randf(1.5, 4) / 100) * 100,
    role, squadLevel: clamp(30 + t.tier * 10 + rand(-6, 6), 20, 96),
    ambition: CLUB_AMBITION_BY_TIER[t.tier] || 'Consolidação',
    objectives: pickN(OFFER_OBJECTIVES_POOL, 3),
  };
}

function presentAgentChoice() {
  STATE.pendingEvent = {
    title: 'Escolha seu Empresário', stamp: 'CONTRATO',
    body: ['Antes de qualquer proposta profissional, você precisa de alguém pra representar seus interesses no mercado.'],
    choices: Object.values(AGENTS).map(a => ({
      label: `${a.name} — comissão ${Math.round(a.commission * 100)}%`, sub: a.desc,
      onclick: `chooseAgentInitial('${a.id}')`,
    })),
  };
  STATE.screen = 'event';
  persist();
  render();
}

function chooseAgentInitial(agentId) {
  STATE.player.agent = agentId;
  addLog(`🤝 Novo empresário: ${AGENTS[agentId].name}.`);
  presentInitialOffers();
}

function presentInitialOffers() {
  const p = STATE.player;
  if (!p.agent) { presentAgentChoice(); return; }
  const agent = AGENTS[p.agent];
  const strong = overallRating(p) >= 58;
  const offers = [buildOfferCard(1, agent, 'titular'), buildOfferCard(1, agent, 'rotação')];
  if (strong || chance(0.25)) offers.push(buildOfferCard(2, agent, 'reserva'));

  STATE.pendingOffers = {
    title: 'Propostas Profissionais',
    intro: 'Seus primeiros contratos como profissional chegaram. Escolha onde vai começar sua carreira.',
    offers, allowStay: false, onAcceptPrefix: 'signInitialOfferByIndex',
  };
  STATE.screen = 'offers';
  persist();
  render();
}

function signInitialOfferByIndex(i) {
  const offer = STATE.pendingOffers.offers[i];
  const p = STATE.player;
  p.club = { name: offer.club, tier: offer.tier, country: offer.country };
  p.contract = { salary: offer.salary, seasonsLeft: offer.years, role: offer.role, bonusGol: Math.round(offer.salary * 0.12 / 100) * 100, signingBonus: offer.signingBonus, objectives: offer.objectives };
  p.money += offer.signingBonus;
  p.history.push({ name: offer.club, tier: offer.tier, phase: 'pro' });
  p.stats.clubsCount++;
  addLog(`✍️ Contrato assinado com ${offer.club} (Série ${offer.division})! ${fmtMoney(offer.salary)}/mês + luva de ${fmtMoney(offer.signingBonus)}.`);
  STATE.pendingOffers = null;
  STATE.screen = 'hub';
  persist();
  render();
}

/* =========================== 11. FASE: PROFISSIONAL =========================== */

function computeSquadStatus(p) {
  const score = p.morale + (overallRating(p) - 55) * 0.4;
  if (score >= 58) return 'titular';
  if (score >= 28) return 'reserva';
  return 'fora';
}

function fractionalGain(x) {
  const base = Math.floor(x);
  const remainder = x - base;
  return base + (chance(remainder) ? 1 : 0);
}

function growWithDiminish(p, key, base, mult) {
  const cur = p.attrs[key];
  const dim = clamp(1.35 - cur / 115, 0.15, 1.2);
  const gain = fractionalGain(base * mult * dim);
  if (gain > 0) growAttr(p, key, gain);
  return gain;
}

function applyAutomaticTraining(p) {
  if (!Array.isArray(p.trainingFocus) || !p.trainingFocus.length) {
    p.trainingFocus = [p.trainingFocus && ATTR_KEYS.includes(p.trainingFocus) ? p.trainingFocus : pickDefaultFocus(p)];
  }
  p.trainingFocus = p.trainingFocus.filter(k => ATTR_KEYS.includes(k)).slice(0, 3);
  if (!p.trainingFocus.length) p.trainingFocus = [pickDefaultFocus(p)];

  const mult = clamp(1 + personalityFx('trainingMult') - p.fatigue / 260, 0.65, 1.9);

  const gains = {};
  p.trainingFocus.forEach(k => { gains[k] = growWithDiminish(p, k, 0.66, mult); });

  ATTR_KEYS.forEach(k => {
    if (p.trainingFocus.includes(k)) return;
    growWithDiminish(p, k, 0.38, mult);
  });

  p.fatigue = clamp(p.fatigue + rand(1, 3), 0, 100);
  if (p.fatigue >= 94 && chance(0.02)) triggerInjury('sobrecarga de jogos e treinos');
  return { focusList: p.trainingFocus, gains };
}

function proWeekAction(resting) {
  const p = STATE.player;
  STATE.milestoneFlash = null;
  if (p.injury) return;
  let trainResult = null;
  if (resting) {
    p.fatigue = clamp(p.fatigue - rand(30, 42), 0, 100);
    p.morale = clamp(p.morale + rand(2, 5), 0, 100);
  } else {
    trainResult = applyAutomaticTraining(p);
  }
  p.week++;
  p.money += p.contract.salary;
  if (p.flags.passiveIncome) p.money += p.flags.passiveIncome;
  applyBillsAndUpkeep(p);
  if (resting) {
    addLog(`😴 Semana de descanso — fadiga aliviada. 💰 Salário: ${fmtMoney(p.contract.salary)}.`);
  } else {
    const gainedParts = trainResult.focusList.filter(k => trainResult.gains[k] > 0).map(k => `${ATTR_LABELS[k]} +${trainResult.gains[k]}`);
    if (gainedParts.length) addLog(`💪 Treino: ${gainedParts.join(', ')}. 💰 Salário: ${fmtMoney(p.contract.salary)}.`);
    else addLog(`💰 Salário recebido: ${fmtMoney(p.contract.salary)}.`);
  }
  applyWeeklyPassives();

  p.squadStatus = computeSquadStatus(p);
  const seasonTurn = ((p.week - 1) % CONFIG.TURNS_PER_SEASON) + 1;
  const isSeasonFinal = seasonTurn === CONFIG.TURNS_PER_SEASON;

  if (p.squadStatus === 'fora') {
    addLog('📋 Moral baixa pesou: você nem foi relacionado para este jogo.');
    advanceFriendsRandom();
    if (p.flags.babyReady) { triggerChildBirth(); persist(); render(); return; }
    if (isSeasonFinal) { p.season++; p.age++; applyAgingEffects(); if (!checkAndQueueBirthday18(p, 'finishProSeason')) finishProSeason(); }
    else { STATE.screen = 'hub'; }
    persist(); render();
    return;
  }

  const reduced = p.squadStatus === 'reserva';
  const oppStrength = clamp(30 + p.club.tier * 10 + rand(-8, 10), 20, 96);

  beginMatch({
    opponentName: pickOpponentClub(p), opponentStrength: oppStrength,
    teamStrength: overallRating(p) + p.club.tier * 3 + rand(-4, 4) - (reduced ? 6 : 0),
    importance: isSeasonFinal ? 'final' : (chance(0.3) ? 'marquee' : 'normal'),
    onResolve: 'pro', context: { squadStatus: p.squadStatus },
  });
}

function applyAgingEffects() {
  const p = STATE.player;
  if (p.age >= 31) {
    ['velocidade', 'forca', 'resistencia'].forEach(k => { if (chance(0.35)) growAttr(p, k, -rand(1, 3)); });
    addLog('🕰️ A idade começa a pesar um pouco no seu físico.');
  }
}

function continuePro() {
  const p = STATE.player;
  const pm = STATE.pendingMatch;
  const seasonTurn = ((p.week - 1) % CONFIG.TURNS_PER_SEASON) + 1;
  const isSeasonEnd = seasonTurn === CONFIG.TURNS_PER_SEASON;
  STATE.pendingMatch = null;

  if (isSeasonEnd) {
    p.season++;
    p.age++;
    applyAgingEffects();
    if (!checkAndQueueBirthday18(p, 'finishProSeason')) finishProSeason();
  } else if (!maybeQueuePostMatchEvent(pm)) {
    STATE.screen = 'hub';
  }
  persist();
  render();
}

function estimateMarketValue(p) {
  const rating = overallRating(p);
  const ageFactor = p.age <= 24 ? 1.2 : p.age <= 29 ? 1.0 : p.age <= 33 ? 0.7 : 0.4;
  const tierFactor = p.club ? p.club.tier : 1;
  return Math.round(rating * rating * tierFactor * ageFactor * 1600);
}

function buildProSeasonSummaryData() {
  const p = STATE.player;
  const ss = p.seasonStats;
  const avgRating = ss.matches ? ss.ratingSum / ss.matches : 0;
  const lines = [`Temporada encerrada — ${p.age} anos, ${p.club.name}.`, `${ss.matches} jogos · ${ss.goals} gols · ${ss.assists} assistências · nota média ${avgRating.toFixed(1)}.`];

  const titleChance = clamp(0.14 + p.club.tier * 0.05 + (avgRating - 6) * 0.06, 0.03, 0.55);
  if (chance(titleChance)) {
    const pool = p.club.tier >= 5 ? TITLE_POOL_ELITE.concat(TITLE_POOL_DOMESTIC) : TITLE_POOL_DOMESTIC;
    const t = pick(pool);
    p.trophies.push({ name: t, season: p.season - 1, age: p.age, club: p.club.name });
    p.stats.titles++;
    checkMilestones(p);
    lines.push(`🏆 Campeão: ${t}!`);
  }

  if (avgRating >= 7.6 && chance(0.3)) {
    let award, repBonus = 25;
    const eliteEligible = avgRating >= 8.6 && p.reputation >= 900 && p.club.tier >= 5;
    if (eliteEligible && chance(0.15)) { award = chance(0.5) ? 'Bola de Ouro' : 'The Best FIFA'; repBonus = 70; }
    else if (ss.goals >= 20 && chance(0.45)) { award = 'Chuteira de Ouro'; repBonus = 40; }
    else if (ss.goals >= 14 && chance(0.5)) award = 'Artilheiro do Campeonato';
    else if (p.age <= 21) award = 'Revelação do Ano';
    else if (avgRating >= 8.3) award = 'Craque da Temporada';
    else award = pick(AWARD_POOL);
    p.awardsLog.push({ name: award, season: p.season - 1, age: p.age });
    p.reputation += repBonus;
    lines.push(`🥇 Prêmio individual: ${award}!`);
  }

  p.stats.maxValue = Math.max(p.stats.maxValue, estimateMarketValue(p));
  p.seasonStats = { matches: 0, goals: 0, assists: 0, ratingSum: 0, wins: 0, draws: 0, losses: 0 };
  return lines;
}

function finishProSeason() {
  const lines = buildProSeasonSummaryData();
  STATE.pendingSummary = { title: 'Fim de Temporada', stamp: 'PROFISSIONAL', lines, kind: 'pro-end' };
  STATE.screen = 'summary';
}

/* =========================== 12. EVENTOS PARALELOS =========================== */

function returnToHub() { STATE.pendingEvent = null; STATE.screen = 'hub'; persist(); render(); }
function openView(panel) { STATE.viewPanel = panel; STATE.screen = 'view'; render(); }
function closeView() { STATE.viewPanel = null; STATE.screen = 'hub'; render(); }

function spendMoney(kind) {
  const p = STATE.player;
  if (kind === 'familia') {
    const cost = Math.min(p.money, 5000 + rand(0, 5000));
    p.money -= cost;
    p.morale = clamp(p.morale + 8, 0, 100);
    p.followers += rand(50, 200);
    addLog(`❤️ Você ajudou sua família (${fmtMoney(cost)}). A torcida percebe.`);
  } else if (kind === 'treino') {
    const cost = 8000 + rand(0, 4000);
    if (p.money < cost) addLog('💸 Você não tem dinheiro suficiente pra isso agora.');
    else { p.money -= cost; const k = pick(POSITIONS[p.position].primary); growAttr(p, k, rand(2, 4)); addLog(`🏋️ Treinamento particular pago: ${ATTR_LABELS[k]} evolui.`); }
  }
  returnToHub();
}

function advanceFriendsRandom() {
  const p = STATE.player;
  p.friends.forEach(f => {
    if (f.path === 'abandonou' || f.path === 'profissional_destaque') return;
    if (f.closeness == null) f.closeness = 60;
    const drift = clamp(0.025 - (f.closeness - 50) / 4000, 0.008, 0.05);
    if (chance(drift)) {
      const abandonChance = clamp(0.3 - f.closeness / 300, 0.05, 0.4);
      if (chance(abandonChance)) { f.path = 'abandonou'; addLog(`📰 Seu amigo ${f.name} pendurou as chuteiras e seguiu outro caminho.`); }
      else {
        const idx = FRIEND_PATH_ORDER.indexOf(f.path);
        if (idx < FRIEND_PATH_ORDER.length - 1) { f.path = FRIEND_PATH_ORDER[idx + 1]; addLog(`📰 Notícia do bairro: ${f.name} ${FRIEND_PATH_LABEL[f.path]}!`); }
      }
    }
    f.closeness = clamp(f.closeness - 0.15, 0, 100);
  });
}

const FRIEND_ACTIVITY_TEXT = {
  festa: ['Vocês foram numa festa e relembraram os tempos de bairro.', 'A festa foi até tarde — muita risada e história repetida.'],
  pelada: ['Rolou uma pelada no campinho, do jeito que era antes.', 'Vocês dividiram os times como na infância.'],

};

function openFriendInteract(idx) {
  const p = STATE.player;
  const f = p.friends[idx];
  if (!f) { STATE.screen = 'hub'; render(); return; }
  const weeksSince = p.week - (f.lastInteractWeek == null ? -999 : f.lastInteractWeek);
  if (weeksSince < 2) {
    STATE.pendingEvent = {
      title: f.name, stamp: 'AMIGOS',
      body: ['Vocês já se falaram recentemente.', '"Volta aqui daqui uns dias — aproveita e cuida da sua vida também!"'],
      choices: [{ label: 'Voltar', onclick: 'closeView()' }],
    };
    STATE.screen = 'event';
    persist(); render();
    return;
  }

    { label: '🎉 Ir a uma festa', sub: 'Sobe a moral, mas cansa um pouco', onclick: `friendAction(${idx},'festa')` },
    { label: '⚽ Jogar uma pelada', sub: 'De graça — e pode render um treino extra', onclick: `friendAction(${idx},'pelada')` },
    { label: '💬 Bater um papo', sub: 'Rápido e fortalece o vínculo', onclick: `friendAction(${idx},'papo')` },

  choices.push({ label: '📞 Ligar pra saber como está', sub: 'Simples, mas mantém o vínculo', onclick: `friendAction(${idx},'ligar')` });

}

function friendAction(idx, kind) {
  const p = STATE.player;
  const f = p.friends[idx];
  if (!f) { returnToHub(); return; }
  if (f.closeness == null) f.closeness = 60;
  f.lastInteractWeek = p.week;

  const askKinds = ['festa', 'pelada', 'jogo'];
  if (askKinds.includes(kind) && f.closeness < 30 && chance(0.45)) {
    addLog(`😕 ${f.name} não topou dessa vez — vocês andam meio distantes ultimamente.`);
    returnToHub();
    return;
  }

  if (kind === 'festa') {
    p.morale = clamp(p.morale + rand(6, 12), 0, 100);
    p.fatigue = clamp(p.fatigue + rand(6, 12), 0, 100);
    f.closeness = clamp(f.closeness + rand(6, 12), 0, 100);
    addLog(`🎉 ${pick(FRIEND_ACTIVITY_TEXT.festa)}`);
    if (p.phase === 'pro' && chance(0.1)) {
      p.reputation = Math.max(0, p.reputation - rand(3, 8));
      addLog('📸 Fotos da festa viralizaram e renderam uma pequena polêmica.');
    }
  } else if (kind === 'pelada') {
    p.morale = clamp(p.morale + rand(4, 9), 0, 100);
    f.closeness = clamp(f.closeness + rand(5, 10), 0, 100);
    addLog(`⚽ ${pick(FRIEND_ACTIVITY_TEXT.pelada)}`);
    if (chance(0.3)) {
      const k = pick(POSITIONS[p.position].primary);
      growAttr(p, k, 1);
      addLog(`Sem nem perceber, ${ATTR_LABELS[k]} evoluiu um pouco jogando por diversão.`);
    }
  } else if (kind === 'papo') {
    p.morale = clamp(p.morale + rand(3, 6), 0, 100);
    f.closeness = clamp(f.closeness + rand(8, 14), 0, 100);
    addLog(`💬 ${pick(FRIEND_ACTIVITY_TEXT.papo)}`);
  } else if (kind === 'ajudar') {
    const cost = Math.min(p.money, rand(2000, 8000));
    if (cost < 500) {
      addLog('💸 Você não tem dinheiro sobrando pra ajudar agora.');
    } else {
      p.money -= cost;
      p.morale = clamp(p.morale + rand(5, 10), 0, 100);
      f.closeness = clamp(f.closeness + rand(15, 25), 0, 100);
      if (f.path === 'amador' && chance(0.3)) { f.path = 'base'; addLog(`🎁 Com sua ajuda, ${f.name} conseguiu uma chance na base de um clube!`); }
      else addLog(`🎁 Você ajudou ${f.name} com ${fmtMoney(cost)}. Ele não vai esquecer isso.`);
    }
  } else if (kind === 'jogo') {
    p.morale = clamp(p.morale + rand(4, 8), 0, 100);
    f.closeness = clamp(f.closeness + rand(8, 14), 0, 100);
    p.followers += rand(20, 80);
    addLog(`🏟️ ${pick(FRIEND_ACTIVITY_TEXT.jogo)}`);
  } else if (kind === 'ligar') {
    p.morale = clamp(p.morale + rand(1, 3), 0, 100);
    f.closeness = clamp(f.closeness + rand(3, 6), 0, 100);
    addLog(`📞 ${pick(FRIEND_ACTIVITY_TEXT.ligar)}`);
  }
  returnToHub();
}

function queueInjuryEvent() {
  const inj = STATE.player.injury;
  STATE.pendingEvent = {
    title: 'Departamento Médico', stamp: 'LESÃO',
    body: [`Diagnóstico: ${inj.name}.`, `"Você precisa ficar cerca de ${inj.turnsLeft} semana(s) fora." — diz o médico.`],

      { label: 'Respeitar o tratamento', onclick: "injuryChoice('respeitar')" },
      { label: 'Tentar voltar antes do prazo', onclick: "injuryChoice('antecipar')" },

  };
  STATE.screen = 'event';
}

function injuryChoice(choice) {
  const p = STATE.player;
  if (choice === 'respeitar') addLog('🩺 Você segue o tratamento à risca.');
  else {
    p.injury.turnsLeft = Math.max(1, Math.ceil(p.injury.turnsLeft / 2));
    p.injury.triedEarly = true;
    if (chance(0.35)) { p.injury.turnsLeft += rand(2, 5); p.morale = clamp(p.morale - 10, 0, 100); addLog('⚠️ Você voltou cedo demais e a lesão piorou.'); }

function resolveSocialPost(tone) {
  const p = STATE.player;
  let followerGain, scandalChance, text;
  if (tone === 'motivacional') { text = 'Post motivacional bem recebido pelos fãs.'; followerGain = rand(40, 120); scandalChance = 0.02; }
  else if (tone === 'descontraido') { text = 'Post descontraído viraliza um pouco.'; followerGain = rand(60, 180); scandalChance = 0.05; }
  else { text = 'A provocação repercute — parte torce, parte critica.'; followerGain = rand(100, 300); scandalChance = 0.22; }

  scandalChance = clamp(scandalChance + personalityFx('scandalMult') * 0.1, 0.01, 0.6);
  followerGain = Math.round(followerGain * (1 + p.reputation / 2000));
  p.followers += followerGain;

  if (chance(scandalChance)) {
    p.reputation = Math.max(0, p.reputation - rand(8, 20));
    p.morale = clamp(p.morale - rand(3, 8), 0, 100);
    addLog(`📱 ${text} Mas gerou polêmica — parte da torcida critica a postura.`);
  } else {
    p.morale = clamp(p.morale + rand(1, 4), 0, 100);
    addLog(`📱 ${text} (+${followerGain} seguidores)`);
  }
  returnToHub();
}

function maybeQueuePostMatchEvent(pm) {
  const p = STATE.player;
  advanceFriendsRandom();
  if (p.flags.babyReady) { triggerChildBirth(); return true; }
  if (pm.gotInjured) { queueInjuryEvent(); return true; }
  if (p.phase !== 'bairro' && pm.rating >= 7 && chance(p.phase === 'pro' ? 0.3 : 0.18)) { queueInterviewEvent(); return true; }
  if (p.phase === 'pro' && chance(0.16)) { queueSocialPostEvent(); return true; }
  if (p.romance.partner) {
    if (p.romance.partner.happiness < 20 && chance(0.12)) { queueRelationshipCrisisEvent(); return true; }
    if (p.romance.status === 'namorando' && p.romance.partner.happiness >= 75 && (p.age - p.romance.partner.since) >= 1 && chance(0.05)) { queueProposalEvent(); return true; }
    if (p.romance.status === 'noivo' && chance(0.06)) { queueWeddingEvent(); return true; }
  }
  return false;
}

function triggerChildBirth() {
  const p = STATE.player;
  p.flags.babyReady = false;
  STATE.pendingEvent = null;
  STATE.childNameDraft = { first: '', last: p.name.split(' ').slice(-1)[0] || '' };
  STATE.screen = 'name-child';
}

/* ---- sequência pós-temporada: seleção / transferência / contrato / raízes / aposentadoria ---- */

function afterSummaryContinue() {
  const s = STATE.pendingSummary;
  const p = STATE.player;
  STATE.pendingSummary = null;
  if (!s) { STATE.screen = 'hub'; persist(); render(); return; }
  if (s.kind === 'base-end') {
    if (s.proceed) { p.phase = 'pro'; p.week = 1; p.rival = null; presentInitialOffers(); } else { STATE.screen = 'hub'; persist(); render(); }
    return;
  }
  if (s.kind === 'pro-end') {
    STATE.postSeasonQueue = ['national', 'transfer', 'contract', 'homecoming', 'retirement'];
    runNextPostSeasonStep();
    return;
  }
  STATE.screen = 'hub'; persist(); render();
}

function runNextPostSeasonStep() {
  if (!STATE.postSeasonQueue || STATE.postSeasonQueue.length === 0) { STATE.screen = 'hub'; persist(); render(); return; }
  const step = STATE.postSeasonQueue.shift();
  if (step === 'national') return stepNationalCheck();
  if (step === 'transfer') return stepTransferCheck();
  if (step === 'contract') return stepContractCheck();
  if (step === 'homecoming') return stepHomecomingCheck();
  if (step === 'retirement') return stepRetirementCheck();
  runNextPostSeasonStep();
}

function stepNationalCheck() {
  const p = STATE.player;
  const nt = p.nationalTeam;
  let called = false;
  if (nt.level === 0 && p.reputation >= 260 && p.age <= 20 && chance(0.5)) { nt.level = 1; called = true; }
  else if (nt.level === 1 && p.reputation >= 480 && p.age <= 23 && chance(0.4)) { nt.level = 2; called = true; }
  else if (nt.level <= 2 && p.reputation >= 900 && chance(0.35)) { nt.level = 3; called = true; }
  else if (nt.level === 3 && chance(p.reputation >= 1400 ? 0.88 : 0.62)) called = true;

  if (!called) { runNextPostSeasonStep(); return; }
  const label = nt.level === 1 ? 'Sub-20' : nt.level === 2 ? 'Sub-23' : 'Principal';
  STATE.pendingEvent = {
    title: 'Convocação!', stamp: 'SELEÇÃO',
    body: ['"Você foi convocado para representar seu país." 🇧🇷', `Seleção Brasileira ${label} — sua janela de ${CONFIG.NATIONAL_WINDOW_MATCHES} jogos começa agora.`],
    choices: [{ label: 'Disputar a janela', onclick: `playNationalWindow('${label}')` }],
  };
  STATE.screen = 'event';
  persist();
  render();
}

function playNationalWindow(label) {
  STATE.nationalWindow = { left: CONFIG.NATIONAL_WINDOW_MATCHES, label };
  STATE.pendingEvent = null;
  playNextNationalMatch();
}

function playNextNationalMatch() {
  const p = STATE.player;
  const oppStrength = clamp(70 + rand(-10, 20), 55, 99);
  beginMatch({
    opponentName: `Seleção de ${pick(TRANSFER_COUNTRIES)}`, opponentStrength: oppStrength,
    teamStrength: clamp(overallRating(p) + 15 + rand(-5, 5), 40, 99),
    importance: p.stats.caps === 0 ? 'debut' : 'marquee', onResolve: 'national',
  });
}

function continueNational() {
  const p = STATE.player;
  const pm = STATE.pendingMatch;
  p.stats.caps++;
  checkMilestones(p);
  p.nationalTeam.caps++;
  p.nationalTeam.goals += pm.playerGoals;
  p.stats.natGoals += pm.playerGoals;
  STATE.pendingMatch = null;
  STATE.nationalWindow.left--;
  persist();
  if (STATE.nationalWindow.left > 0) { playNextNationalMatch(); return; }
  addLog(`🇧🇷 Fim da janela da Seleção (${STATE.nationalWindow.label}).`);
  STATE.nationalWindow = null;
  runNextPostSeasonStep();
}

function stepTransferCheck() {
  const p = STATE.player;
  const moraleFactor = clamp(0.45 + p.morale / 100, 0.45, 1.45);
  const offerChance = clamp((0.12 + (repLevelIndex(p.reputation) - 1) * 0.09 + (p.contract.seasonsLeft <= 1 ? 0.2 : 0)) * moraleFactor, 0.03, 0.8);
  if (!chance(offerChance)) { runNextPostSeasonStep(); return; }

  const agent = AGENTS[p.agent];
  const lvl = repLevelIndex(p.reputation);
  const tierCap = p.morale < 40 ? clamp(lvl, 1, 5) : clamp(lvl + 1, 1, 6);
  const tierFloor = clamp(p.club.tier, 1, 6);
  const numOffers = clamp(2 + Math.floor(lvl / 3), 2, 4);
  const offers = [];
  for (let i = 0; i < numOffers; i++) {
    const t = clamp(tierFloor + rand(0, 2), 1, tierCap);
    offers.push(buildOfferCard(t, agent, chance(0.5) ? 'titular' : 'rotação'));
  }

  STATE.pendingOffers = {
    title: offers.length > 1 ? 'Propostas de Transferência' : 'Proposta de Transferência',
    intro: `Você recebeu ${offers.length} proposta${offers.length > 1 ? 's' : ''} pelo seu passe. Compare os clubes e decida seu futuro.`,
    offers, allowStay: true, currentClub: p.club.name,
    onAcceptPrefix: 'acceptTransferOfferByIndex',
  };
  STATE.screen = 'offers';
  persist();
  render();
}

function acceptTransferOfferByIndex(i) { acceptTransferOffer(STATE.pendingOffers.offers[i]); }

function acceptTransferOffer(offer) {
  const p = STATE.player;
  addLog(`🌎 Transferência! De ${p.club.name} para ${offer.club} (${offer.country}).`);
  p.club = { name: offer.club, tier: offer.tier, country: offer.country };
  p.history.push({ name: offer.club, tier: offer.tier, phase: 'pro' });
  p.stats.clubsCount++;
  p.contract = { salary: offer.salary, seasonsLeft: offer.years, role: offer.role, bonusGol: Math.round(offer.salary * 0.12 / 100) * 100, signingBonus: offer.signingBonus, objectives: offer.objectives };
  p.money += offer.signingBonus;
  STATE.pendingOffers = null;
  runNextPostSeasonStep();
}

function declineTransferOffer() { STATE.pendingOffers = null; runNextPostSeasonStep(); }

function stepContractCheck() {
  const p = STATE.player;
  p.contract.seasonsLeft--;
  if (p.contract.seasonsLeft > 0) { runNextPostSeasonStep(); return; }

  const newSalary = Math.round(p.contract.salary * clamp(1 + p.reputation / 700, 1.05, 2) / 100) * 100;
  STATE.pendingEvent = {
    title: 'Fim de Contrato', stamp: 'CONTRATO',
    body: [`Seu vínculo com o ${p.club.name} chega ao fim.`],
    choices: [
      { label: `Renovar por ${fmtMoney(newSalary)}/mês`, sub: '3 anos', onclick: `renewContract(${newSalary},3)` },
      { label: 'Trocar de empresário e negociar', onclick: 'promptAgentSwitch()' },
    ],
  };
  STATE.screen = 'event';
  persist();
  render();
}

function renewContract(salary, years) {
  STATE.player.contract = { salary, seasonsLeft: years, role: 'titular', bonusGol: Math.round(salary * 0.15 / 100) * 100 };
  addLog(`✍️ Contrato renovado: ${fmtMoney(salary)}/mês por ${years} anos.`);
  runNextPostSeasonStep();
}

function promptAgentSwitch() {
  const p = STATE.player;
  const choices = Object.values(AGENTS).filter(a => a.id !== p.agent).map(a => ({ label: a.name, sub: a.desc, onclick: `switchAgentAndRenew('${a.id}')` }));
  choices.push({ label: 'Manter empresário atual e renovar', onclick: `renewContract(${Math.round(p.contract.salary * 1.15 / 100) * 100},3)` });
  STATE.pendingEvent = { title: 'Trocar de Empresário', stamp: 'CONTRATO', body: ['Romper com o empresário atual pode gerar desgaste, mas pode abrir novas portas.'], choices };
  STATE.screen = 'event';
  persist();
  render();
}

function switchAgentAndRenew(agentId) {
  const p = STATE.player;
  p.agent = agentId;
  addLog(`🤝 Novo empresário: ${AGENTS[agentId].name}.`);
  renewContract(Math.round(p.contract.salary * 1.1 / 100) * 100, 3);
}

function stepHomecomingCheck() {
  const p = STATE.player;
  if (!p.flags.wentHome && repLevelIndex(p.reputation) >= 5) {
    p.flags.wentHome = true;
    STATE.pendingEvent = {
      title: 'O Retorno ao Bairro', stamp: 'RAÍZES',
      body: ['Anos depois, você volta ao campo de terra onde tudo começou.', 'Tem gente nova jogando ali — do jeito que você jogava.', 'Seu antigo treinador aparece pra te ver.'],
      choices: [
        { label: 'Organizar uma partida beneficente', onclick: "homecomingChoice('partida')" },
        { label: 'Reformar o campo do bairro', onclick: "homecomingChoice('reforma')" },
      ],
    };

function homecomingChoice(kind) {
  const p = STATE.player;
  if (kind === 'partida') {
    p.morale = clamp(p.morale + 15, 0, 100);
    p.followers += rand(500, 2000);
    addLog('🏠 A partida beneficente emociona o bairro inteiro.');
  } else {
    p.money -= Math.max(0, Math.min(p.money * 0.1, 50000));
    p.reputation += 30;
    addLog('🏠 O campinho de terra agora tem grama e arquibancada — com seu nome no muro.');
  }
  runNextPostSeasonStep();
}

function stepRetirementCheck() {
  const p = STATE.player;
  if (p.age >= CONFIG.FORCE_RETIRE_AGE) { startRetirement(true); return; }
  if (p.age >= CONFIG.RETIRE_MIN_AGE) {
    STATE.pendingEvent = {
      title: 'Encruzilhada da Carreira', stamp: 'CARREIRA',
      body: [`Você tem ${p.age} anos.`, p.age >= 34 ? 'O corpo já não responde como antes, mas a decisão é sua.' : 'Ainda dá pra render bastante — mas alguns preferem parar no topo.'],
      choices: [
        { label: 'Continuar jogando', onclick: 'runNextPostSeasonStep()' },
        { label: 'Encerrar a carreira', onclick: 'startRetirement(false)' },
      ],
    };
    STATE.screen = 'event';
    persist();
    render();
    return;
  }
  runNextPostSeasonStep();
}

function applyWeeklyPassives() {
  const p = STATE.player;
  applyInvestmentGrowth(p);
  if (p.romance.partner) {
    p.romance.partner.happiness = clamp(p.romance.partner.happiness - randf(0.3, 0.8), 0, 100);
  }
  if (p.romance.pregnancy) {
    p.romance.pregnancy.dueInWeeks--;
    if (p.romance.pregnancy.dueInWeeks <= 0) p.flags.babyReady = true;
  }
}

function applyBillsAndUpkeep(p) {
  let total = 0;
  (p.vehicles || []).forEach(v => { total += v.upkeep || 0; });
  (p.properties || []).forEach(pr => { total += pr.upkeep || 0; });
  if (total > 0) {
    p.money -= total;
    if (p.money < -15000) p.morale = clamp(p.morale - 2, 0, 100);
  }
}

function pickN(arr, n) {
  const copy = arr.slice();
  const out = [];
  for (let i = 0; i < n && copy.length; i++) {
    const idx = rand(0, copy.length - 1);
    out.push(copy[idx]);
    copy.splice(idx, 1);
  }
  return out;
}
